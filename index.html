<script>
  try {
    const producao = /vercel\.app$/.test(location.hostname);
    if (window.Sentry && producao) Sentry.init({
      dsn: 'https://83c93a952415462ac07fdff041756402@o4512279478534144.ingest.us.sentry.io/4512279486922752',
      environment: 'producao', sendDefaultPii: false, tracesSampleRate: 0,
      // falhas de rede e avisos inofensivos do navegador não são erro do app
      ignoreErrors: ['ResizeObserver loop', 'Failed to fetch', 'Load failed', 'NetworkError', 'AbortError', 'The operation was aborted'],
      denyUrls: [/extensions\//i, /^chrome-extension:\/\//i, /^moz-extension:\/\//i],

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<link rel="stylesheet" href="app.css?v=95">

<body>

<div id="carregando" class="carregando">Carregando…</div>

<!-- Login -->
<section id="tela-login" class="login" hidden>
  <form class="cartao" id="form-login">
    <img src="icon-192.png" alt="">
    <h1>Por Onde Andei</h1>
    <p id="login-sub">Entre para ver seu mapa de viagens.</p>
    <input id="login-email" type="email" placeholder="E-mail" autocomplete="email" required>
    <input id="login-senha" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" minlength="6" required>
    <div class="erro" id="login-erro" hidden></div>
    <button class="btn principal" id="login-btn" type="submit">Entrar</button>
    <button class="link" id="login-alternar" type="button">Primeira vez? Criar conta</button>
    <button class="link" id="login-esqueci" type="button">Esqueci a senha</button>
  </form>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="topo">
    <h1>Por Onde <span>Andei</span></h1>
    <span id="sinal" class="sinal" hidden></span>
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar lugar…" autocomplete="off" enterkeyhint="search">
      <div class="resultados" id="resultados" hidden></div>
    </div>
    <button class="btn-icone" id="btn-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>
  <nav class="contadores" id="contadores"></nav>
  <main class="corpo">
    <div id="mapa">
      <button class="fab" id="btn-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Lugar</button>
      <div class="aviso-mapa" id="aviso-mira" hidden>Toque no mapa onde fica o lugar <button id="cancelar-mira">Cancelar</button></div>
    </div>
    <section class="painel" id="painel" data-gaveta="meia">
      <div class="alca" id="alca" aria-label="Arrastar a lista"><span></span></div>
      <div class="painel-topo">
        <h2 id="painel-titulo">Cidades</h2>
        <select id="ordem" aria-label="Ordem da lista"></select>
        <input id="filtro" type="search" placeholder="Filtrar lista">
      </div>
      <div class="cab-rotulos" id="cab-rotulos"></div>
      <div class="lista" id="lista"></div>
    </section>
  </main>
  <nav class="barra-nav" id="barra-nav">
    <button data-nav="mapa" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Mapa</span></button>
    <button data-nav="band"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Bandeiras</span></button>
    <button data-nav="voos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg><span>Voos</span></button>
    <button data-nav="est"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Estatísticas</span></button>
    <button data-nav="mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Mais</span></button>
  </nav>
</div>

<div id="modais"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/base.js?v=95"></script>
<script src="js/bases.js?v=95"></script>
<script src="js/mapa.js?v=95"></script>
<script src="js/lista.js?v=95"></script>
<script src="js/rotulos-fotos.js?v=95"></script>
<script src="js/viagens.js?v=95"></script>
<script src="js/estatisticas.js?v=95"></script>
<script src="js/voos.js?v=95"></script>
<script src="js/inicio.js?v=95"></script>
</body>
</html>
