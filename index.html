<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Por Onde Andei</title>
<meta name="theme-color" content="#123a3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
/* Layout: barra superior + contadores; mapa em cima e lista embaixo no celular, lista lateral no computador */
:root {
  --bg: #eef2f1; --surface: #ffffff; --surface-2: #f6f8f8; --ink: #10292c; --muted: #5b6f71; --line: #d8e1e0;
  --primary: #123a3f; --on-primary: #f2e8d5; --accent: #e4572e; --visit: #0f8b7d; --want: #e9b949;
  --map-bg: #dfe8e7; --map-border: #9fb3b2; --danger: #c2372b;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
  color-scheme: light;
}
/* App segue o tema do aparelho; o mapa fica sempre claro (--map-* não mudam) */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1719; --surface: #122326; --surface-2: #0f1e20; --ink: #e4eeed; --muted: #8fa5a6; --line: #22393c;
  --primary: #0e2c30; --on-primary: #f2e8d5; --accent: #f06a43; --visit: #2fb3a3; --want: #e9b949;
  --danger: #ef6b5e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1719; --surface: #122326; --surface-2: #0f1e20; --ink: #e4eeed; --muted: #8fa5a6; --line: #22393c;
  --primary: #0e2c30; --on-primary: #f2e8d5; --accent: #f06a43; --visit: #2fb3a3; --want: #e9b949;
  --danger: #ef6b5e; color-scheme: dark; }
:root[data-theme="dark"] .item .tipo { color: var(--on-primary); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .item .tipo { color: var(--on-primary); } }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- App shell ---------- */
:root { --nav-h: 60px; }
#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; }
#btn-menu { display: none; }
body.publico #btn-menu { display: grid; }
.barra-nav { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 1100; }
.barra-nav button { flex: 1; border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 8px 2px 7px; color: var(--muted); font: 600 .7rem var(--f-body); }
.barra-nav svg { width: 22px; height: 22px; }
.barra-nav button[aria-current="page"] { color: var(--primary); }
.barra-nav button[aria-current="page"] svg { background: color-mix(in srgb, var(--visit) 18%, transparent); border-radius: 99px; padding: 2px 14px; box-sizing: content-box; }
@media (prefers-color-scheme: dark) { .barra-nav button[aria-current="page"] { color: var(--visit); } }
.topo { background: var(--primary); color: var(--on-primary); display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; }
.topo h1 { font: 800 1.2rem/1 var(--f-display); letter-spacing: -.01em; margin: 0 auto 0 4px; white-space: nowrap; }
.topo h1 span { color: var(--accent); }
.btn-icone { background: none; border: 0; color: inherit; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.btn-icone:hover { background: rgba(255,255,255,.08); }
.btn-icone svg { width: 22px; height: 22px; }

.busca { position: relative; flex: 1; max-width: 520px; }
.busca input { width: 100%; border: 0; border-radius: 999px; padding: 9px 14px 9px 38px; background: rgba(255,255,255,.12); color: var(--on-primary); }
.busca input::placeholder { color: rgba(242,232,213,.7); }
.busca svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; opacity: .8; }
.resultados { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); color: var(--ink);
  border-radius: var(--r); box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 1200; max-height: 60vh; overflow: auto; }
.resultados button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.resultados button:hover { background: var(--surface-2); }
.resultados small { display: block; color: var(--muted); font-size: .8rem; }
.resultados .vazio { padding: 12px 14px; color: var(--muted); }
.resultados .grupo-busca { padding: 8px 14px 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; background: var(--surface-2); }
.resultados .mundo b { color: var(--accent); }
.aviso-mun { background: color-mix(in srgb, var(--want) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--want) 55%, transparent); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; font-size: .9rem; }
.aviso-mun span { color: var(--muted); }

.contadores { display: flex; gap: 2px; padding: 0 6px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.contadores::-webkit-scrollbar { display: none; }
.contador { flex: 1 0 auto; border: 0; background: none; padding: 6px 8px; margin: 6px 0; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; border-radius: 99px; color: var(--ink); }
.contador svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.contador.extras { flex: 0 0 auto; border-left: 1px solid var(--line); border-radius: 0 99px 99px 0; padding-left: 10px; opacity: .85; }
.contador.extras[aria-pressed="true"] { opacity: 1; border-radius: 99px; }
.menu-lista button svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 4px; color: var(--muted); }
.contador b { font: 800 1rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.contador[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .contador[aria-pressed="true"] { background: var(--visit); color: #04201c; } :root:not([data-theme="light"]) .contador[aria-pressed="true"] svg { color: #04201c; } }
.contador[aria-pressed="true"] svg, .contador[aria-pressed="true"] b small { color: var(--on-primary); opacity: .85; }
.contador b small { font: 600 .75rem var(--f-body); color: var(--muted); }
.contador span { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }


.corpo { position: relative; display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; }
#app { min-width: 0; overflow-x: hidden; }
@media (min-width: 900px) { .corpo { grid-template-rows: none; grid-template-columns: minmax(0,1fr) 420px; } }
#mapa { min-height: 0; background: var(--map-bg); position: relative; }
@media (max-width: 899px) {
  .painel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1001; border-radius: 16px 16px 0 0; border-top: 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,.18); transition: height .25s ease; height: 44%; }
  .painel[data-gaveta="fechada"] { height: 104px; }
  .painel[data-gaveta="cheia"] { height: calc(100% - 12px); }
  .painel.arrastando { transition: none; }
  .alca { display: grid; place-items: center; height: 18px; cursor: grab; touch-action: none; }
  .alca span { width: 40px; height: 5px; border-radius: 99px; background: var(--line); }
  .painel-topo { border-bottom: 0; padding-top: 0; }
  .painel[data-gaveta="fechada"] .cab-rotulos, .painel[data-gaveta="fechada"] .lista { visibility: hidden; }
  #mapa .fab { bottom: calc(44% + 12px); transition: bottom .25s ease; }
  .leaflet-bottom { bottom: 44%; }
}
@media (min-width: 900px) { .alca { display: none; } .corpo { grid-template-columns: minmax(0,1fr) 420px; } }
.painel { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--line); }
@media (min-width: 900px) { .painel { border-top: 0; border-left: 1px solid var(--line); } }

.painel-topo { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.painel-topo h2 { font: 700 1rem var(--f-display); margin: 0; flex: 1; min-width: 0; }
#ordem { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 6px 8px; font: inherit; font-size: .85rem; max-width: 130px; }
.painel-topo input { width: 38%; max-width: 180px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .9rem; }
.cab-rotulos { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; justify-content: flex-start; min-width: 0; font-size: .8rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cab-rotulos span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.cab-rotulos { gap: 4px 6px !important; }
.cab-rotulos .leg { gap: 4px; padding: 2px 6px 2px 0; }
.cab-rotulos .leg svg { width: 14px; height: 14px; flex: none; }
.cab-rotulos i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--c); flex: none; }
.lista { overflow-y: auto; flex: 1; padding-bottom: env(safe-area-inset-bottom, 0px); }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.item .tipo { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--primary); border: 1px solid var(--line); }
.item .tipo svg { width: 16px; height: 16px; }
.item .txt { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; }
.item .txt b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .txt small { display: block; color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marcas { display: flex; gap: 6px; flex: none; }
.marca { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--c); background: transparent; display: grid; place-items: center; padding: 0; }
.marca svg { width: 16px; height: 16px; color: #fff; opacity: 0; }
.marca[aria-pressed="true"] { background: var(--c); }
.marca[aria-pressed="true"] svg { opacity: 1; }
.add-pais { display: block; width: calc(100% - 24px); margin: 10px 12px 14px; padding: 10px; border: 1px dashed var(--line); border-radius: var(--r); background: none; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; }
.vazio-lista { padding: 28px 20px; color: var(--muted); text-align: center; }
.vazio-lista b { display: block; color: var(--ink); font: 700 1.05rem var(--f-display); margin-bottom: 4px; }
.no-mapa { padding: 8px 12px; font-size: .82rem; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.no-mapa button { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; white-space: nowrap; }
.grupo { padding: 10px 12px 4px; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.bandeira { font-size: 1.2rem; width: 30px; text-align: center; flex: none; }

/* FAB */
.fab { position: absolute; right: 12px; bottom: 12px; z-index: 900; background: var(--accent); color: #fff; border: 0; border-radius: 999px;
  padding: 10px 16px 10px 12px; display: flex; align-items: center; gap: 6px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.fab svg { width: 20px; height: 20px; }
.aviso-mapa { position: absolute; left: 50%; top: 12px; translate: -50% 0; z-index: 900; background: var(--primary); color: var(--on-primary);
  padding: 8px 14px; border-radius: 999px; font-size: .88rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.aviso-mapa button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }
.mira #mapa .leaflet-container { cursor: crosshair; }

/* Leaflet ajustes */
.leaflet-container { background: var(--map-bg); font-family: var(--f-body); }
.rot-mapa { background: none !important; border: 0 !important; }
.rot-mapa div { font: 600 11px/1.1 var(--f-body); color: var(--muted); text-align: center; white-space: nowrap; translate: -50% -50%; width: max-content;
  text-shadow: 0 0 3px var(--map-bg), 0 0 3px var(--map-bg), 0 0 2px var(--map-bg); pointer-events: none; text-transform: uppercase; letter-spacing: .06em; }
.rot-mapa.estado div { font-size: 10px; font-weight: 500; letter-spacing: .04em; }
.rot-mapa.visitado div { color: var(--ink); }
.t1, .t2, .t3, .e1, .e2 { display: none; }
.z3 .t1, .z4 .t1, .z4 .t2, .z5 .t1, .z5 .t2, .z5 .t3 { display: block; }
.z5 .e1, .z6 .e1, .z6 .e2 { display: block; }
.z6 .rot-mapa.pais div { opacity: .55; }
.pino { background: none; border: 0; }
.pino div { width: 22px; height: 22px; border-radius: 50%; background: var(--c); border: 2px solid #fff; display: grid; place-items: center; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); translate: -50% -50%; }
.pino.base div { background: #fff; color: var(--cb); border: 2px solid var(--cb); width: 20px; height: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.25); opacity: .9; }
.pino div.cat { border: 3px solid var(--c); width: 24px; height: 24px; }
.pino.base div svg { width: 11px; height: 11px; }
.item.base .txt b { font-weight: 500; }
.ctl-local a { display: grid !important; place-items: center; color: #1a73e8 !important; }
.ctl-local a svg { width: 18px; height: 18px; }
.ctl-local.buscando a svg { animation: pisca 1s infinite; }
@keyframes pisca { 50% { opacity: .3; } }
.pino.cidade div { width: 24px; height: 24px; background: #fff; border: 3px solid var(--c); font-size: 15px; line-height: 1; }
.pino div svg { width: 12px; height: 12px; }
.pino div.band { overflow: hidden; }
.leaflet-tooltip.rot-lugar { background: var(--surface); color: var(--ink); border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 11px; padding: 2px 6px; }
.leaflet-tooltip.rot-lugar::before { display: none; }
.leaflet-control-attribution { font-size: 9px; background: color-mix(in srgb, var(--surface) 75%, transparent) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line); }

/* ---------- Modais ---------- */
.fundo { position: fixed; inset: 0; background: rgba(5,15,16,.55); z-index: 2000; display: grid; place-items: end center; }
/* com a barra de navegação, as telas abrem acima dela (a barra continua tocável) */
body:not(.publico) .fundo { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
.fundo > .modal { max-height: calc(100% - 24px); }
@media (min-width: 600px) { .fundo { place-items: center; } }
.modal { background: var(--surface); width: min(100%, 520px); max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 600px) { .modal { border-radius: 16px; } }
.modal h3 { font: 800 1.25rem/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.modal p { margin: 0; color: var(--muted); }
.campo { display: grid; gap: 4px; }
.campo label, .rotulo-campo { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.campo input, .campo select, .campo textarea { width: 100%; min-width: 0; max-width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.campo textarea { min-height: 70px; resize: vertical; }
.linha { display: flex; gap: 10px; flex-wrap: wrap; }
.linha > * { flex: 1 1 140px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--c); background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--c); color: #fff; }
.add-visita { display: flex; gap: 8px; flex-wrap: wrap; }
.add-visita select, .add-visita input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; flex: 1 1 120px; }
.add-visita .btn { flex: 0 0 auto; padding: 8px 14px; }
.chip.visita { display: inline-flex; align-items: center; gap: 4px; background: var(--c); color: #fff; padding-right: 4px; }
.chip.visita button { border: 0; background: rgba(255,255,255,.25); color: #fff; width: 20px; height: 20px; border-radius: 50%; padding: 0; line-height: 1; }
.linha-tempo { display: grid; gap: 2px; }
.linha-tempo .ano { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 6px; border-bottom: 2px solid var(--accent); }
.linha-tempo .ano b { font: 800 1.4rem var(--f-display); }
.linha-tempo .ano span { color: var(--muted); font-size: .85rem; }
.linha-tempo .evento { display: flex; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.linha-tempo .evento .tipo { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.linha-tempo .evento .tipo svg { width: 14px; height: 14px; }
.linha-tempo .evento .txt { min-width: 0; }
.linha-tempo .evento b { display: block; font-weight: 600; }
.linha-tempo .evento small { color: var(--muted); }
.modal h4 { font: 700 .8rem var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 6px 0 -4px; }
.destaques { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.destaques div { background: var(--surface-2); border-radius: 10px; padding: 12px 10px; display: grid; gap: 2px; }
.destaques b { font: 800 1.5rem/1.1 var(--f-display); color: var(--visit); font-variant-numeric: tabular-nums; }
.destaques span { font-size: .78rem; color: var(--muted); }
.barra { display: grid; gap: 4px; }
.modal h5 { margin: 14px 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.anos { display: grid; gap: 4px; margin: 6px 0 10px; }
.ano { display: grid; grid-template-columns: 3.2em 1fr 2.4em; align-items: center; gap: 8px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.ano b { text-align: right; } .ano-barra { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.ano-barra div { height: 100%; background: var(--visit); border-radius: 99px; }
.casa-campo { margin-bottom: 6px; }
.rank-form { display: grid; gap: 2px; margin: -4px 0 12px; padding: 8px 12px; border-radius: var(--r); background: var(--surface-2); border-left: 4px solid var(--line); }
.rank-form small { color: var(--muted); }
.rank-form[data-porte] { border-left-color: var(--porte-grande); }
.rank-form[data-porte="medio"] { border-left-color: var(--porte-medio); }
.rank-form[data-porte="pequeno"] { border-left-color: var(--porte-pequeno); }
:root { --porte-grande: #d6453d; --porte-medio: #e0a526; --porte-pequeno: #8a9a9b; }
.item .tipo[data-porte] { border: 2.5px solid var(--porte-grande); }
.item .tipo[data-porte="medio"] { border-color: var(--porte-medio); }
.item .tipo[data-porte="pequeno"] { border-color: var(--porte-pequeno); }
.pino div[data-porte] { box-shadow: 0 0 0 2.5px var(--porte-grande), 0 1px 4px rgba(0,0,0,.35); }
.pino div[data-porte="medio"] { box-shadow: 0 0 0 2.5px var(--porte-medio), 0 1px 4px rgba(0,0,0,.35); }
.pino div[data-porte="pequeno"] { box-shadow: 0 0 0 2.5px var(--porte-pequeno), 0 1px 4px rgba(0,0,0,.35); }
.sigla[data-porte] { border: 2px solid var(--porte-grande); }
.sigla[data-porte="medio"] { border-color: var(--porte-medio); }
.sigla[data-porte="pequeno"] { border-color: var(--porte-pequeno); }

function distKm(a, b, c, d) {
  const R = 6371, r = Math.PI / 180, dLat = (c - a) * r, dLon = (d - b) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ================= Geografia (países e estados) ================= */
function preparaFeicoes(fc) {
  return fc.features.map(f => {
    const g = f.geometry; if (!g) return null;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    let minX = 180, minY = 90, maxX = -180, maxY = -90, maior = null, maiorArea = -1;
    for (const p of polys) {
      let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
      for (const [x, y] of p[0]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      const area = (x1 - x0) * (y1 - y0);
      if (area > maiorArea) { maiorArea = area; maior = [x0, y0, x1, y1]; }
      minX = Math.min(minX, x0); minY = Math.min(minY, y0); maxX = Math.max(maxX, x1); maxY = Math.max(maxY, y1);
    }
    return { ...f.properties, feature: f, polys, bbox: [minX, minY, maxX, maxY], maior, tam: maior ? Math.hypot(maior[2] - maior[0], maior[3] - maior[1]) : 0 };
  }).filter(Boolean);
}
function noAnel(x, y, anel) {
  let dentro = false;
  for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) {
    const xi = anel[i][0], yi = anel[i][1], xj = anel[j][0], yj = anel[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) dentro = !dentro;
  }
  return dentro;
}
function contem(f, x, y) {
  const b = f.bbox; if (x < b[0] || x > b[2] || y < b[1] || y > b[3]) return false;
  for (const p of f.polys) {
    if (!noAnel(x, y, p[0])) continue;
    let buraco = false; for (let k = 1; k < p.length; k++) if (noAnel(x, y, p[k])) { buraco = true; break; }
    if (!buraco) return true;
  }
  return false;
}
function acha(lista, lat, lon) {
  for (const f of lista) if (contem(f, lon, lat)) return f;
  // pontos no litoral podem cair "no mar" por causa da simplificação: procura em volta
  for (const raio of [0.04, 0.12, 0.3]) for (let a = 0; a < 8; a++) {
    const ang = a * Math.PI / 4, x = lon + raio * Math.cos(ang), y = lat + raio * Math.sin(ang);
    for (const f of lista) if (contem(f, x, y)) return f;
  }
  return null;
}
function localizar(lat, lon, paisDica) {
  let estado = acha(S.estados, lat, lon);
  let pais = estado ? (S.paisPorId.get(estado.pais) || acha(S.paises, lat, lon)) : acha(S.paises, lat, lon);
  if (!pais && paisDica) pais = S.paisPorId.get(paisDica.toUpperCase()) || null;
  return { pais: pais ? pais.id : (estado ? estado.pais : (paisDica || '').toUpperCase() || null), estado: estado ? estado.id : null };
}
let geoPromessa = null;
function carregaGeo() { return geoPromessa ||= baixaGeo().catch(e => { geoPromessa = null; throw e; }); }
async function baixaGeo() {
  const [tp, te] = await Promise.all([fetch('paises.json').then(r => r.json()), fetch('estados.json').then(r => r.json())]);
  const fp = topojson.feature(tp, Object.values(tp.objects)[0]);

  S.paises = preparaFeicoes(fp); S.estados = preparaFeicoes(fe);
  // Natural Earth põe algumas ilhas em "Seven seas"; vão para o continente da classificação da ONU
  const ILHAS = { SC: 'Africa', MU: 'Africa', SH: 'Africa', IO: 'Africa', TF: 'Africa', MV: 'Asia', GS: 'South America', HM: 'Oceania' };
  S.paises.forEach(p => { if (ILHAS[p.id]) p.continente = ILHAS[p.id]; });
  S.paises.forEach(p => S.paisPorId.set(p.id, p));
  S.estados.forEach(e => S.estadoPorId.set(e.id, e));
  S.fcPaises = fp; S.fcEstados = fe;
}

/* ================= Sem internet ================= */
// Cópia local dos dados (para abrir sem conexão) e fila de alterações feitas offline,
// enviada sozinha quando a internet volta. Ids de lugares novos são gerados no aparelho.
const CHAVE_COPIA = 'poa-copia-v1', CHAVE_FILA = 'poa-fila-v1';
const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
function salvaCopia() {
  if (S.publico || !S.user) return;
  try {
    localStorage.setItem(CHAVE_COPIA, JSON.stringify({ user: { id: S.user.id, email: S.user.email }, em: Date.now(), rotulos: S.rotulos, lugares: S.lugares,
      lr: [...S.lr].map(([l, m]) => [l, [...m.keys()]]), visitas: S.visitas || [], viagens: S.viagens || [], paradas: S.paradas || [], voos: S.voos || [], config: S.config || {} }));
  } catch {}
}
let tCopia; const agendaCopia = () => { clearTimeout(tCopia); tCopia = setTimeout(salvaCopia, 1500); };
function leCopia() { try { return JSON.parse(localStorage.getItem(CHAVE_COPIA)); } catch { return null; } }
function aplicaCopia(c) {
  S.rotulos = c.rotulos || []; S.lugares = (c.lugares || []).map(l => l.tipo === 'porto' ? { ...l, tipo: 'atracao' } : l); S.visitas = c.visitas || []; S.viagens = c.viagens || []; S.paradas = c.paradas || []; S.voos = c.voos || []; S.config = c.config || {};
  S.lr = new Map((c.lr || []).map(([l, rs]) => [l, new Map(rs.map(r => [r, null]))]));
}
let fila = (() => { try { return JSON.parse(localStorage.getItem(CHAVE_FILA)) || []; } catch { return []; } })();
function salvaFila() { try { localStorage.setItem(CHAVE_FILA, JSON.stringify(fila)); } catch {} atualizaSinal(); }
const erroDeRede = e => !e || /fetch|network|load failed|rede|timeout/i.test(e.message || String(e));
function executa(op) {
  const q = supa.from(op.tabela);
  if (op.tipo === 'inserir') return q.insert(op.linha);
  if (op.tipo === 'atualizar') return q.update(op.valores).match(op.filtro);
  if (op.tipo === 'apagar') return q.delete().match(op.filtro);
  return Promise.resolve({});
}
// grava agora; sem conexão, guarda na fila
async function grava(op) {
  if (navigator.onLine) {
    try { const { error } = await executa(op); if (!error) return {}; if (!erroDeRede(error)) return { error }; }
    catch (e) { if (!erroDeRede(e)) return { error: e }; }
  }
  fila.push(op); salvaFila(); return { naFila: true };
}
let sincronizando = false;
async function sincroniza() {
  if (sincronizando || !fila.length || !navigator.onLine) return;
  sincronizando = true; atualizaSinal();
  try {
    let enviados = 0;
    while (fila.length) {
      let res; try { res = await executa(fila[0]); } catch (e) { res = { error: e }; }
      if (res?.error && erroDeRede(res.error)) break;
      // 23505 = já existia; outro erro descarta a alteração para a fila não travar
      if (res?.error && res.error.code !== '23505') toast('Uma alteração feita sem internet não pôde ser salva: ' + res.error.message, 5000);
      fila.shift(); salvaFila(); enviados++;
    }
    if (!fila.length && enviados) toast(enviados === 1 ? 'A alteração feita sem internet foi salva' : `${enviados} alterações feitas sem internet foram salvas`);
  } finally { sincronizando = false; atualizaSinal(); }
}
function atualizaSinal() {
  const el = document.getElementById('sinal'); if (!el) return;
  const off = !navigator.onLine;
  el.hidden = !off && !fila.length;
  el.textContent = off ? (fila.length ? `Sem internet · ${fila.length} pendente${fila.length > 1 ? 's' : ''}` : 'Sem internet') : `Enviando ${fila.length}…`;
}
window.addEventListener('online', () => { atualizaSinal(); sincroniza(); });
window.addEventListener('offline', atualizaSinal);

/* ================= Dados ================= */
async function todos(montar) {
  let out = [], de = 0;
  for (;;) {
    const { data, error } = await montar().range(de, de + 999);
    if (error) throw error;
    out = out.concat(data); if (data.length < 1000) break; de += 1000;
  }
  return out;
}
async function carregaDados() {
  let rot = await todos(() => supa.from('viagem_rotulos').select('*').order('ordem'));
  if (!rot.length) {
    const { data, error } = await supa.from('viagem_rotulos').insert(ROTULOS_PADRAO).select();
    if (error) throw error; rot = data.sort((a, b) => a.ordem - b.ordem);
  }
  S.rotulos = rot;
  S.lugares = await todos(() => supa.from('viagem_lugares').select('*').order('nome'));
  S.lugares.forEach(l => { if (l.tipo === 'porto') l.tipo = 'atracao'; }); // portos saíram do app
  const lr = await todos(() => supa.from('viagem_lugar_rotulos').select('lugar_id,rotulo_id,data'));
  S.visitas = await todos(() => supa.from('viagem_visitas').select('id,lugar_id,data,precisao,nota,viagem_id').order('data', { ascending: false })).catch(() => []);
  S.viagens = await todos(() => supa.from('viagem_viagens').select('*')).catch(() => []);
  S.paradas = await todos(() => supa.from('viagem_paradas').select('id,viagem_id,lugar_id,ordem,transporte')).catch(() => []);
  S.voos = await todos(() => supa.from('viagem_voos').select('*').order('data')).catch(() => []);
  S.config = (await supa.from('viagem_config').select('casa_lugar_id').maybeSingle().then(r => r.data).catch(() => null)) || {};
  S.lr = new Map();
  for (const x of lr) { if (!S.lr.has(x.lugar_id)) S.lr.set(x.lugar_id, new Map()); S.lr.get(x.lugar_id).set(x.rotulo_id, x.data); }
  salvaCopia();
}
const rotulosDe = id => S.lr.get(id) || new Map();
// rótulo pode valer só para alguns tipos (ex.: Escala só em aeroportos)
const rotuloServe = (r, tipo) => !r.tipos?.length || r.tipos.includes(tipo);
const rotulosPara = tipo => S.rotulos.filter(r => rotuloServe(r, tipo));
const TIPOS_DA_ABA = { transporte: ['aeroporto'] };
const rotulosDaAba = aba => S.rotulos.filter(r => !r.tipos?.length || (TIPOS_DA_ABA[aba] || [aba]).some(t => r.tipos.includes(t)));

// rótulos como "Escala": contam o lugar (aeroporto entra na contagem), mas não pintam país nem estado
const idsSoLugar = () => new Set(S.rotulos.filter(r => r.so_lugar && !r.conta_como_visita).map(r => r.id));
function soLugar(lugarId, so = idsSoLugar()) { for (const r of rotulosDe(lugarId).keys()) if (so.has(r)) return true; return false; }
function visitado(lugarId, vis = idsVisita()) { for (const r of rotulosDe(lugarId).keys()) if (vis.has(r)) return true; return false; }
function corDoLugar(lugarId) {
  const m = rotulosDe(lugarId);
  for (const r of S.rotulos) if (m.has(r.id)) return r.cor;
  return '#8a9a9b';
}
// tirou a última marcação: lugar sem rótulo não serve pra nada, então pergunta se exclui
function perguntaExcluirSemRotulo(lugarId, rotuloId, nome) {
  abreModal(`<h3>Excluir ${esc(nome)}?</h3>
    <p class="meta">Ele ficou sem nenhuma marcação. Se não vai usar, dá pra excluir da sua lista.</p>
    <div class="acoes"><button class="btn" id="sr-volta">Remarcar</button><button class="btn" id="sr-manter">Manter sem marcação</button><button class="btn perigo" id="sr-excluir">Excluir</button></div>`, (mm, fechar) => {
    mm.querySelector('#sr-volta').onclick = () => { fechar(); alternaRotulo(lugarId, rotuloId); };
    mm.querySelector('#sr-manter').onclick = fechar;
    mm.querySelector('#sr-excluir').onclick = () => { fechar(); excluiLugar(lugarId); };

async function marcaCidadeDe(lugarId) {

      c = { nome: m.nome, lat: m.lat, lon: m.lon, pais: 'BR', estado: l.estado, ref: refIbge(m) };

async function salvaRotulosDoLugar(id, sel) {

  for (const r of tirar) { const { error } = await grava({ tipo: 'apagar', tabela: 'viagem_lugar_rotulos', filtro: { lugar_id: id, rotulo_id: r } }); if (error) throw error; }
  if (por.length) { const { error } = await grava({ tipo: 'inserir', tabela: 'viagem_lugar_rotulos', linha: por.map(r => ({ lugar_id: id, rotulo_id: r })) }); if (error) throw error; }
  const m = new Map(); sel.forEach(r => m.set(r, atual.get(r) ?? null));

function novoLugar(dados, sugestoes) {

// Tocar num ícone do mapa (museu, praça, igreja, estádio, aeroporto...) abre o cadastro com o nome certo.
// Restaurante, loja, farmácia etc. não entram: não são tipos do app.
const POI_OK = new Set(['museum', 'art_gallery', 'attraction', 'monument', 'memorial', 'castle', 'ruins', 'archaeological_site', 'historic',
  'place_of_worship', 'church', 'cathedral', 'park', 'garden', 'zoo', 'aquarium', 'theme_park', 'stadium', 'theatre', 'viewpoint',
  'beach', 'harbor', 'ferry_terminal', 'aerodrome', 'airport', 'town_hall', 'fort', 'lighthouse', 'waterfall', 'peak', 'national_park', 'nature_reserve']);
function poiNoPonto(e) {
  if (!fundo?.vetorial || !fundo.getMaplibreMap) return null;
  const ml = fundo.getMaplibreMap(); if (!ml?.queryRenderedFeatures) return null;
  const pt = ml.project([e.latlng.lng, e.latlng.lat]), r = 24; // margem de um dedo
  const fs = ml.queryRenderedFeatures([[pt.x - r, pt.y - r], [pt.x + r, pt.y + r]])
    .filter(f => f.layer?.type === 'symbol' && f.properties?.name && f.geometry?.type === 'Point'
      && (f.sourceLayer === 'aerodrome_label' || (f.sourceLayer === 'poi' && (POI_OK.has(f.properties.class) || POI_OK.has(f.properties.subclass)))));
  if (!fs.length) return null;
  const d = f => { const q = ml.project(f.geometry.coordinates); return (q.x - pt.x) ** 2 + (q.y - pt.y) ** 2; };
  return fs.sort((a, b) => d(a) - d(b))[0];
}
async function tocaIconeDoMapa(e) {
  if (S.publico) return;
  const f = poiNoPonto(e); if (!f) return;
  const p = f.properties, [lon, lat] = f.geometry.coordinates;
  const nome = p['name:pt'] || p['name:latin'] || p.name;
  const ja = S.lugares.find(l => norm(l.nome) === norm(nome) && distKm(l.lat, l.lon, lat, lon) < 1);
  if (ja) return abreLugar(ja.id);
  const tipo = f.sourceLayer === 'aerodrome_label' || p.class === 'aerodrome' ? 'aeroporto'
    : ['museum', 'art_gallery'].includes(p.class) || p.subclass === 'museum' ? 'museu'
    : 'atracao';
  // aeroporto da base oficial (pelo código IATA) entra ligado ao ranking
  if (tipo === 'aeroporto' && p.iata) { try { await carregaBase('aeroporto'); const b = acharBase('iata:' + p.iata); if (b) return abreBase(b.ref); } catch {} }
  const dados = { lat, lon, tipo, nome, pais: localizar(lat, lon).pais };
  confereMuseuOficial(dados).then(ok => ok && novoLugar(dados));
}
async function novoLugarEm(lat, lon) {
  if (S.publico) return;
  let sugestoes = [], tipo = 'cidade';
  const loc = localizar(lat, lon);
  if (loc.pais === 'BR') {
    try { await carregaMunicipios(); sugestoes = municipiosProximos(lat, lon, 3).map(m => m.nome); } catch {}
  }
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=pt-BR`).then(r => r.json());
    const a = r.address || {};
    const cidade = a.city || a.town || a.municipality || a.village;
    if (loc.pais === 'BR') {
      // município oficial primeiro; o nome do ponto (praia, atração) depois
      const oficial = cidade && municipioPorNome(cidade, ufDe(loc.estado));
      if (oficial) sugestoes = [oficial.nome, ...sugestoes.filter(s => s !== oficial.nome)];
      if (r.name && r.name !== cidade) sugestoes.push(r.name);
    } else {
      sugestoes = [cidade, r.name].filter(Boolean);
    }
    tipo = r.name && r.name !== cidade ? tipoDoResultado(r) : 'cidade';
    if (tipo === 'bairro') tipo = 'cidade';
  } catch {}
  sugestoes = [...new Set(sugestoes)].slice(0, 5);
  novoLugar({ lat, lon, tipo, nome: '' }, sugestoes.length ? sugestoes : null);
}

function vaiPara(lat, lon, zoomMin) {

  const pt = mapa.latLngToContainerPoint([lat, lon]), tam = mapa.getSize(), m = 30;

const NAO_CIDADE = new Set(['hamlet', 'isolated_dwelling', 'neighbourhood', 'suburb', 'quarter', 'city_block', 'locality', 'farm', 'croft', 'allotments', 'plot', 'borough', 'residential']);
function tipoDoResultado(r) {
  const c = r.category || r.class, t = r.type;
  if (c === 'aeroway') return 'aeroporto';
  if (t === 'museum' || r.addresstype === 'museum') return 'museu';
  if (c === 'place' || c === 'boundary') return NAO_CIDADE.has(t) || NAO_CIDADE.has(r.addresstype) ? 'bairro' : 'cidade';
  if (['tourism', 'historic', 'leisure', 'natural', 'amenity', 'building', 'man_made'].includes(c)) return 'atracao';
  return 'atracao'; // estação, igreja, prédio, parque…: ponto de visita
}
function buscaPaises(q, qtd = 3) {
  const n = norm(q); if (n.length < 2) return [];
  const comeca = [], contem = [];
  for (const p of S.paises) { const k = norm(p.nome || ''); if (k.startsWith(n)) comeca.push(p); else if (k.includes(n)) contem.push(p); }
  return [...comeca, ...contem].slice(0, qtd);
}

const PALAVRAS_VAZIAS = new Set(['de', 'do', 'da', 'dos', 'das', 'e', 'o', 'a', 'museu', 'casa', 'memorial', 'centro', 'cultural', 'espaco', 'municipal', 'historico', 'historica']);

  if (d.pais !== 'BR' || !['museu', 'atracao'].includes(d.tipo) || !pareceMuseu) return true;

    .filter(c => c.km < 3 && (c.comuns > 0 || (d.tipo === 'museu' && c.km < 0.3))).sort((a, b) => b.comuns - a.comuns || a.km - b.km).slice(0, 4);

let digitaTimer;
function sugereEnquantoDigita(q) {
  clearTimeout(digitaTimer);
  const box = $('#resultados');
  if (q.trim().length < 2) { box.hidden = true; return; }
  digitaTimer = setTimeout(async () => {
    try { await carregaMunicipios(); } catch {}
    const ms = buscaMunicipios(q);
    box.hidden = false;
    box.innerHTML = linhasPaises(q) + (ms.length ? `<div class="grupo-busca">Municípios do Brasil</div>${ms.map(linhaMunicipio).join('')}` : '')
      + `<button data-mundo="1" class="mundo"><b>Buscando “${esc(q.trim())}” no mundo…</b><small>Cidades de fora, aeroportos, atrações</small></button>`;
    ligaResultados(box, []);
    // procura no mundo sozinho quando a pessoa para de digitar (sem precisar tocar no botão)
    if (q.trim().length >= 3) digitaTimer = setTimeout(() => { if ($('#busca').value.trim() === q.trim()) buscar(q.trim()); }, 800);
  }, 120);
}
let buscaSeq = 0;
async function buscar(q) {
  if (q.length < 2) return;
  clearTimeout(digitaTimer);
  const box = $('#resultados'); const seq = ++buscaSeq;
  try { await carregaMunicipios(); } catch {}
  const ms = buscaMunicipios(q, 4);
  const topo = linhasPaises(q) + (ms.length ? `<div class="grupo-busca">Municípios do Brasil</div>${ms.map(linhaMunicipio).join('')}` : '');
  box.hidden = false; box.innerHTML = topo + '<div class="vazio">Buscando no mundo…</div>';
  try {
    // além da busca no mundo, procura só na área que está no mapa (com folga): assim a praça da cidade
    // que você está olhando aparece primeiro, mesmo existindo dezenas de lugares com o mesmo nome
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&limit=12&addressdetails=1&accept-language=pt-BR`;
    let area = null;
    if (mapa && mapa.getZoom() >= 5) { const b = mapa.getBounds().pad(0.5); area = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].map(v => v.toFixed(4)).join(','); }
    const [locais, globais] = await Promise.all([
      area ? fetch(`${url}&viewbox=${area}&bounded=1`).then(r => r.json()).catch(() => []) : Promise.resolve([]),
      fetch(url).then(r => r.json()),
    ]);
    if (seq !== buscaSeq) return;
    locais.forEach(x => x._perto = true);
    const r = [...locais, ...globais.filter(g => !locais.some(l => l.osm_type === g.osm_type && l.osm_id === g.osm_id))];
    // cidades do Brasil já vêm do IBGE; povoados e bairros não entram como cidade
    const mundo = r.filter(x => {
      const t = tipoDoResultado(x), cc = (x.address?.country_code || '').toUpperCase();
      if (t === 'cidade' && cc === 'BR') return false;
      if (t === 'bairro') return false; // povoado e bairro não entram (não são município)
      return true;
    }).filter((x, i, arr) => {
      // mesmo nome a menos de 50 km (cidade e o departamento/distrito de mesmo nome): fica só o primeiro
      const n = norm(x.name || x.display_name.split(',')[0]);
      return !arr.slice(0, i).some(y => norm(y.name || y.display_name.split(',')[0]) === n && distKm(+x.lat, +x.lon, +y.lat, +y.lon) < 50);
    }).slice(0, 10);
    const linha = (x, i) => `<button data-i="${i}"><b>${esc(x.name || x.display_name.split(',')[0])}</b><small>${esc(TIPOS[tipoDoResultado(x)].um)} · ${esc(x.display_name.split(',').slice(1, 4).join(',').trim())}</small></button>`;
    const perto = mundo.map((x, i) => x._perto ? linha(x, i) : '').join(''), longe = mundo.map((x, i) => x._perto ? '' : linha(x, i)).join('');
    const lista = (perto ? `<div class="grupo-busca">Nesta área do mapa</div>${perto}` : '') + (longe ? `<div class="grupo-busca">No mundo</div>${longe}` : '');
    box.innerHTML = topo + (lista ? lista : (topo ? '' : '<div class="vazio">Nada encontrado. Tente outro nome ou segure o dedo no mapa.</div>'));
    ligaResultados(box, mundo);
  } catch {
    box.innerHTML = topo + '<div class="vazio">Sem conexão com a busca no mundo agora. Tente de novo em instantes.</div>';
    ligaResultados(box, []);
  }
}

// Ajustes conhecidos do export (nome em inglês, tipo errado, duplicados)
const CORRECOES = [
  { em: /airport|airpark|aeroparque|aeropuerto/i, tipo: 'aeroporto' },
  { em: /historic cent|national park|world heritage|unesco/i, tipo: 'unesco' },
];
const NOMES_PT = {
  'guarulhos governador andre franco montoro international airport': ['Aeroporto Internacional de Guarulhos (GRU)', 'iata:GRU'],
  'presidente juscelino kubistschek international airport': ['Aeroporto Internacional de Brasília (BSB)', 'iata:BSB'],
  'presidente juscelino kubitschek international airport': ['Aeroporto Internacional de Brasília (BSB)', 'iata:BSB'],
  'tancredo neves international airport': ['Aeroporto Internacional de Confins (CNF)', 'iata:CNF'],
  'afonso pena airport': ['Aeroporto Internacional Afonso Pena (CWB)', 'iata:CWB'],
  'zumbi dos palmares airport': ['Aeroporto Internacional Zumbi dos Palmares (MCZ)', 'iata:MCZ'],
  'jorge newbery airpark': ['Aeroparque Jorge Newbery (AEP)', 'iata:AEP'],
  'historic centre of the town of olinda': ['Centro Histórico de Olinda', 'unesco:189'],
  'la boca': ['La Boca (Caminito)', null, 'atracao'],
};
// Não são municípios (povoado / região administrativa): ficam fora
const IGNORAR = ['porto da rua', 'gama'];
// No Places Been, "Brasilia" sem acento nesse ponto é o patrimônio da UNESCO (Plano Piloto)
const ESPECIAIS = [{ nome: 'brasilia', lat: -15.78333, lon: -47.9, vira: ['Plano Piloto de Brasília', 'unesco', 'unesco:445'] }];
function lerCSV(txt) {
  const linhas = txt.replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
  const sep = linhas[0].includes(';') ? ';' : ',';
  const cel = l => { const out = []; let cur = '', q = false; for (let i = 0; i < l.length; i++) { const c = l[i];
    if (q) { if (c === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === sep) { out.push(cur); cur = ''; } else cur += c; } out.push(cur); return out; };
  const cab = cel(linhas[0]).map(h => h.trim().toLowerCase());
  return linhas.slice(1).map(l => { const v = cel(l); const o = {}; cab.forEach((h, i) => o[h] = (v[i] || '').trim()); return o; });
}
function preparaImportacao(linhas) {
  const notas = [], novos = [];
  const rotPorStatus = { been: S.rotulos.find(r => r.conta_como_visita) || S.rotulos[0], want: S.rotulos.find(r => norm(r.nome) === 'quero ir'), fave: S.rotulos.find(r => norm(r.nome) === 'favorito') };
  const brutos = linhas.map(x => ({ nomeOrig: x.city || x.name || '', lat: parseFloat(x.lat), lon: parseFloat(x.lon), pais: (x.country || '').toUpperCase(), status: (x.been || '').split(',').map(s => s.trim()).filter(Boolean) }))
    .filter(x => x.nomeOrig && isFinite(x.lat) && isFinite(x.lon));
  for (const b of brutos) {
    if (IGNORAR.includes(norm(b.nomeOrig)) && !S.mun) { notas.push(`${b.nomeOrig}: não é município, ficou de fora`); continue; }
    let tipo = 'cidade', nome = b.nomeOrig, ref = null;
    for (const c of CORRECOES) if (c.em.test(nome)) tipo = c.tipo;
    const fix = NOMES_PT[norm(nome)];
    if (fix) { if (fix[0] !== nome) notas.push(`${nome} → ${fix[0]}`); nome = fix[0]; ref = fix[1]; if (fix[2]) tipo = fix[2]; }
    for (const e of ESPECIAIS) if (norm(b.nomeOrig) === e.nome && distKm(b.lat, b.lon, e.lat, e.lon) < 1) { nome = e.vira[0]; tipo = e.vira[1]; ref = e.vira[2] || ref; notas.push(`${b.nomeOrig} (ponto da UNESCO) → ${nome}, patrimônio da UNESCO`); }
    novos.push({ ...b, tipo, nome, ref });
  }
  // tira duplicados: mesmo tipo, nome parecido e perto (fica o nome mais completo; junta os rótulos)
  const finais = [];
  for (const n of novos) {
    const a = norm(n.nome);
    const dup = finais.find(f => f.tipo === n.tipo && distKm(f.lat, f.lon, n.lat, n.lon) < 15 && (norm(f.nome) === a || norm(f.nome).startsWith(a + ' ') || a.startsWith(norm(f.nome) + ' ')));
    if (dup) {
      // fica o nome mais completo; empate: o que tem acento
      const acento = s => /[^\x00-\x7F]/.test(s);
      const escolhido = n.nome.length > dup.nome.length ? n.nome : n.nome.length < dup.nome.length ? dup.nome : (acento(n.nome) && !acento(dup.nome) ? n.nome : dup.nome);
      notas.push(`Duplicado juntado: ${dup.nome} + ${n.nome} → ${escolhido}`);
      dup.nome = escolhido; dup.status = [...new Set([...dup.status, ...n.status])];
      continue;
    }
    finais.push({ ...n });
  }
  // já existentes no app
  const jaTem = [], inserir = [];
  for (const f of finais) {
    const ex = S.lugares.find(l => l.tipo === f.tipo && norm(l.nome) === norm(f.nome) && distKm(l.lat, l.lon, f.lat, f.lon) < 15);
    (ex ? jaTem : inserir).push(f);
  }
  const validos = [];
  for (const f of inserir) {
    const loc = localizar(f.lat, f.lon, f.pais); f.paisCalc = loc.pais; f.estadoCalc = loc.estado;
    f.rotulos = f.status.map(s => rotPorStatus[s]?.id).filter(Boolean);
    // Brasil: cidade só se for município do IBGE
    if (f.tipo === 'cidade' && loc.pais === 'BR' && S.mun) {
      const m = municipioPorNome(f.nome, ufDe(loc.estado));
      if (!m) { notas.push(`${f.nome}: não é município, ficou de fora`); continue; }
      if (cidadeJaCadastrada(m)) { jaTem.push(f); continue; }
      f.nome = m.nome; f.ref = refIbge(m);
    }
    validos.push(f);
  }
  return { inserir: validos, jaTem, notas, total: brutos.length };
}
function abreImportacao() {
  abreModal(`
    <h3>Importar do Places Been</h3>
    <p>Escolha o arquivo CSV exportado pelo Places Been. Nada é salvo antes de você confirmar.</p>
    <div class="campo"><label for="arq">Arquivo</label><input id="arq" type="file" accept=".csv,text/csv,text/plain"></div>

    };
    m.querySelector('#i-ok').onclick = async ev => {
      ev.target.disabled = true; ev.target.textContent = 'Importando…';
      try {
        const regs = plano.inserir.map(f => ({ tipo: f.tipo, nome: f.nome, lat: f.lat, lon: f.lon, pais: f.paisCalc, estado: f.estadoCalc, ref_externa: f.ref }));
        const { data, error } = await supa.from('viagem_lugares').insert(regs).select();

        if (lr.length) { const { error: e2 } = await supa.from('viagem_lugar_rotulos').insert(lr); if (e2) throw e2; }
        await carregaDados(); atualizaTudo(); fechar();
        toast(`${data.length} lugares importados`, 3500);
        if (camadaPinos.getLayers().length) mapa.fitBounds(L.featureGroup(camadaPinos.getLayers()).getBounds().pad(0.1));
      } catch (e) { toast('Erro na importação: ' + e.message, 5000); ev.target.disabled = false; ev.target.textContent = 'Importar'; }
    };
  });

// Ficam no Supabase Storage (bucket privado viagem-fotos), em <usuário>/<lugar>/<arquivo>.jpg
const fotosCache = new Map();
const pastaFotos = id => `${S.user.id}/${id}`;
async function listaFotos(id, renovar) {
  if (!renovar && fotosCache.has(id)) return fotosCache.get(id);
  const { data, error } = await supa.storage.from('viagem-fotos').list(pastaFotos(id), { limit: 100, sortBy: { column: 'created_at', order: 'asc' } });
  if (error || !data?.length) { fotosCache.set(id, []); return []; }
  const caminhos = data.filter(f => f.name && !f.name.startsWith('.')).map(f => `${pastaFotos(id)}/${f.name}`);
  const { data: urls } = await supa.storage.from('viagem-fotos').createSignedUrls(caminhos, 3600);
  const fotos = (urls || []).filter(u => u.signedUrl).map(u => ({ path: u.path, url: u.signedUrl }));
  fotosCache.set(id, fotos); return fotos;
}
// reduz para no máximo 1600 px e JPEG ~80%, para caber folgado no plano grátis
function reduzImagem(arquivo) {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? ok(b) : falha(new Error('não deu para ler a imagem')), 'image/jpeg', 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('formato de imagem não suportado')); };
    img.src = url;
  });
}
async function enviaFotos(id, arquivos) {
  let ok = 0;
  for (const f of arquivos) {

/* ================= Mapa de bandeiras ================= */
// Países visitados pintados com a própria bandeira (imagens da flagcdn.com)
function carregaImg(src, cors = true) {
  return new Promise(ok => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

async function desenhaMapaBandeiras(canvas, modo = 'paises', arquivos = {}) {
  calcula();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.clientWidth * dpr, H = Math.round(W * 0.75); canvas.width = W; canvas.height = H; canvas.style.height = (H / dpr) + 'px';
  const c = canvas.getContext('2d');
  // modo 'paises': países visitados com a bandeira; 'estados:XX': estados do país XX (sem XX, o da sua casa)
  const [tipoModo, paisModo] = modo.split(':'), ehEstados = tipoModo === 'estados';
  const paisBase = paisModo || casa()?.pais || 'BR';
  const feicoes = ehEstados ? S.estados.filter(e => e.pais === paisBase) : S.paises;
  const vis = feicoes.filter(f => (ehEstados ? estadosVis : paisesVis).has(f.id));
  const enquadrar = ehEstados ? feicoes : vis;
  // enquadra (com folga); sem nenhum, mostra o mundo
  let [x0, y0, x1, y1] = enquadrar.length ? enquadrar.reduce((b, p) => [Math.min(b[0], p.maior[0]), Math.min(b[1], p.maior[1]), Math.max(b[2], p.maior[2]), Math.max(b[3], p.maior[3])], [180, 90, -180, -90]) : [-170, -58, 190, 84];
  const folga = ehEstados ? [0.06, 0.05] : [0.25, 0.15];
  const padX = Math.max(ehEstados ? 1 : 8, (x1 - x0) * folga[0]), padY = Math.max(ehEstados ? 1 : 6, (y1 - y0) * folga[1]);
  x0 -= padX; x1 += padX; y0 -= padY; y1 += padY;
  const latMeio = (y0 + y1) / 2, kx = Math.cos(latMeio * Math.PI / 180);
  let lw = (x1 - x0) * kx, lh = y1 - y0;
  if (lw / lh > W / H) { const nh = lw * H / W; y0 -= (nh - lh) / 2; y1 += (nh - lh) / 2; lh = nh; } else { const nw = lh * W / H; x0 -= (nw - lw) / kx / 2; x1 += (nw - lw) / kx / 2; lw = nw; }
  const px = lon => (lon - x0) * kx / lw * W, py = lat => (y1 - lat) / lh * H;
  const caminho = f => { c.beginPath(); for (const p of f.polys) for (const anel of p) { anel.forEach(([x, y], i) => i ? c.lineTo(px(x), py(y)) : c.moveTo(px(x), py(y))); c.closePath(); } };
  c.fillStyle = '#cfe3ea'; c.fillRect(0, 0, W, H);
  c.lineWidth = dpr * 0.6; c.strokeStyle = '#ffffff';
  for (const p of S.paises) { if (p.bbox[2] < x0 - 10 || p.bbox[0] > x1 + 10) continue; caminho(p); c.fillStyle = '#e9e4da'; c.fill('evenodd'); c.stroke(); }
  if (ehEstados) for (const e of feicoes) { caminho(e); c.fillStyle = '#ddd6c8'; c.fill('evenodd'); c.strokeStyle = '#ffffff'; c.stroke(); }
  const src = f => ehEstados
    ? (arquivos[isoEstado(f.id)] ? urlBandeira(arquivos[isoEstado(f.id)]).replace('width=160', 'width=480') : null)
    : (/^[A-Z]{2}$/.test(f.id) ? `https://flagcdn.com/w640/${f.id.toLowerCase()}.png` : null);
  // estados vêm do Wikimedia: sem crossOrigin (o quadro só é exibido, não exportado)
  const imgs = await Promise.all(vis.map(f => src(f) ? carregaImg(src(f), !ehEstados) : null));
  vis.forEach((p, i) => {
    c.save(); caminho(p); c.clip('evenodd');
    const img = imgs[i], [a, b, d, e] = p.maior;
    if (img) c.drawImage(img, px(a), py(e), px(d) - px(a), py(b) - py(e)); else { c.fillStyle = corToken('--visit'); c.fill(); }
    c.restore(); caminho(p); c.lineWidth = dpr * 1.2; c.strokeStyle = '#1b2b2d'; c.stroke();
  });
}

/* ================= Viagens ================= */
// Uma viagem tem um roteiro ordenado (viagem_paradas), que pode repetir lugares,
// e um mês de início (viagem_viagens.inicio). As visitas do período ficam ligadas a ela.
const nomeMes = ym => `${MESES[+ym.slice(5, 7) - 1]}/${ym.slice(0, 4)}`;
// distância do roteiro em linha reta, somando trecho a trecho
function kmViagem(id) {
  const porLugar = new Map(S.lugares.map(l => [l.id, l]));
  const ps = paradasDe(id).map(p => porLugar.get(p.lugar_id)).filter(Boolean);
  let km = 0; for (let i = 1; i < ps.length; i++) km += distKm(ps[i - 1].lat, ps[i - 1].lon, ps[i].lat, ps[i].lon);
  return Math.round(km);

  const porLugar = new Map(S.lugares.map(l => [l.id, l])), tot = new Map();

    if (ids && !ids.includes(vg.id)) continue;
    const ps = paradasDe(vg.id).filter(p => porLugar.has(p.lugar_id));
    for (let i = 1; i < ps.length; i++) { const a = porLugar.get(ps[i - 1].lugar_id), b = porLugar.get(ps[i].lugar_id), k = trechoLocal(a, b) ? 'local' : (ps[i].transporte || 'sem'); tot.set(k, (tot.get(k) || 0) + distKm(a.lat, a.lon, b.lat, b.lon)); }
  }
  return tot;
}
const resumoTransportes = tot => [...tot].filter(([k]) => TRANSPORTES[k]).sort((a, b) => b[1] - a[1]).map(([k, km]) => `${TRANSPORTES[k][0]} ${fmtKm(Math.round(km))}`).join(' · ');
// trajeto local: entre aeroporto e um lugar a até 60 km (GRU–Guarulhos, MCZ–Maceió); não pergunta transporte
const TERMINAIS = ['aeroporto'];
const trechoLocal = (a, b) => (TERMINAIS.includes(a.tipo) || TERMINAIS.includes(b.tipo)) && a.tipo !== b.tipo && distKm(a.lat, a.lon, b.lat, b.lon) <= 60;

  if ((a.tipo === 'aeroporto' || b.tipo === 'aeroporto') && (a.tipo === b.tipo || distKm(a.lat, a.lon, b.lat, b.lon) > 150)) return 'aviao'; // saiu/chegou de aeroporto e foi longe
  return null;
}
const paradasDe = id => (S.paradas || []).filter(p => p.viagem_id === id).sort((a, b) => a.ordem - b.ordem);
function periodoViagem(vg) {
  const ds = (S.visitas || []).filter(v => v.viagem_id === vg.id).map(v => v.data).concat(vg.inicio ? [vg.inicio] : []).sort();
  if (!ds.length) return '';
  const a = ds[0].slice(0, 7), b = ds[ds.length - 1].slice(0, 7);

}

  const porMes = new Map();
  for (const v of S.visitas || []) { if (v.viagem_id || v.precisao === 'ano') continue; const k = v.data.slice(0, 7); if (!porMes.has(k)) porMes.set(k, []); porMes.get(k).push(v); }

    m.querySelector('#vg-corpo').innerHTML = `

        else { const { data, error } = await supa.from('viagem_viagens').insert({ nome, inicio }).select().single(); if (error) throw error; id = data.id; S.viagens.push(data); }
        // roteiro: troca tudo pela ordem nova
        const { error: e1 } = await supa.from('viagem_paradas').delete().eq('viagem_id', id); if (e1) throw e1;
        const { data: novas, error: e2 } = await supa.from('viagem_paradas').insert(roteiro.map((p, i) => ({ viagem_id: id, lugar_id: p.id, ordem: i + 1, transporte: i && !trechoLocal(porLugar.get(roteiro[i - 1].id), porLugar.get(p.id)) ? p.tr : null }))).select(); if (e2) throw e2;

        if (inicio) {

          const lugares = [...new Set(roteiro.map(p => p.id))];
          const ligar = [], criar = [];
          for (const lid of lugares) {
            const v = (S.visitas || []).filter(x => x.lugar_id === lid && x.precisao !== 'ano' && (!x.viagem_id || x.viagem_id === id) && perto(x.data)).sort((a, b) => a.data.localeCompare(b.data))[0];

          }
          const soltar = (S.visitas || []).filter(x => x.viagem_id === id && !ligar.includes(x.id)).map(x => x.id);
          if (soltar.length) { const { error } = await supa.from('viagem_visitas').update({ viagem_id: null }).in('id', soltar); if (error) throw error; }
          if (ligar.length) { const { error } = await supa.from('viagem_visitas').update({ viagem_id: id }).in('id', ligar); if (error) throw error; }
          S.visitas.forEach(x => { if (soltar.includes(x.id)) x.viagem_id = null; if (ligar.includes(x.id)) x.viagem_id = id; });

const RAD = Math.PI / 180;
function areaAnel(r) {
  let soma = 0;

  return Math.abs(soma) * 6371 * 6371 / 2;
}

const NOME_NIVEL = { cobre: 'Cobre', bronze: 'Bronze', prata: 'Prata', ouro: 'Ouro', platina: 'Platina', diamante: 'Diamante' };
const ESCALA_PEQ = [[.25, 'bronze'], [.5, 'prata'], [.75, 'ouro'], [1, 'diamante']];
const ESCALA_GRD = [[.05, 'cobre'], [.15, 'bronze'], [.3, 'prata'], [.6, 'ouro'], [.9, 'platina'], [1, 'diamante']];

function selo(id, grupo, icone, nome, n, total, marcos) {
  let degraus;
  if (marcos) degraus = marcos.map((q, i) => [q, NIVEIS_MARCO[i]]);
  else {
    let ant = 0;
    degraus = (total > COLECAO_GRANDE ? ESCALA_GRD : ESCALA_PEQ).map(([p, nv]) => { const q = p === 1 ? total : Math.max(ant + 1, Math.ceil(p * total)); ant = q; return [q, nv]; });

    lista.push(selo('regioes-BR', g, GLOBO, 'Regiões', Object.values(REGIOES_BR).filter(u => u.some(x => ufs.has(x))).length, 5));
    lista.push(selo('capitais-BR', g, ICONES.cidade, 'Capitais', CAPITAIS.filter(x => ibgeVis.has(x)).length, 27));

// Estados: imagem oficial do Wikimedia Commons (tabela viagem_bandeiras, código ISO 3166-2 -> arquivo)
const ISO_REGIAO = {"FR-RGUYANEFRAN":"FR-GUF","FR-RHAUTSDEFRA":"FR-HDF","FR-RGRANDEST":"FR-GES","ES-RCEUTA":"ES-CE","IT-RVALLEDAOST":"IT-23","IT-RPIEMONTE":"IT-21","IT-RLOMBARDIA":"IT-25","IT-RTRENTINOAL":"IT-32","IT-RLIGURIA":"IT-42","FR-RPROVENCEAL":"FR-PAC","FR-RAUVERGNERH":"FR-ARA","ES-RMELILLA":"ES-ML","IT-REMILIAROMA":"IT-45","IT-RMARCHE":"IT-57","IT-RVENETO":"IT-34","IT-RFRIULIVENE":"IT-36","FR-RNOUVELLEAQ":"FR-NAQ","ES-RFORALDENAV":"ES-NA","ES-RPAISVASCO":"ES-PV","ES-RARAGON":"ES-AR","FR-ROCCITANIE":"FR-OCC","ES-RCATALUNA":"ES-CT","FR-RBOURGOGNEF":"FR-BFC","ES-REXTREMADUR":"ES-EX","ES-RANDALUCIA":"ES-AN","ES-RGALICIA":"ES-GA","ES-RCASTILLAYL":"ES-CL","IT-RABRUZZO":"IT-65","IT-RMOLISE":"IT-67","IT-RAPULIA":"IT-75","IT-RBASILICATA":"IT-77","IT-RCALABRIA":"IT-78","IT-RCAMPANIA":"IT-72","IT-RLAZIO":"IT-62","IT-RTOSCANA":"IT-52","ES-RVALENCIANA":"ES-VC","ES-RMURCIA":"ES-MU","ES-RASTURIAS":"ES-AS","ES-RCANTABRIA":"ES-CB","FR-RPAYSDELALO":"FR-PDL","FR-RBRETAGNE":"FR-BRE","FR-RNORMANDIE":"FR-NOR","FR-RMARTINIQUE":"FR-MTQ","FR-RGUADELOUPE":"FR-GUA","FR-RREUNION":"FR-LRE","FR-RMAYOTTE":"FR-MAY","ES-RCANARYIS":"ES-CN","IT-RSICILY":"IT-82","ES-RISLASBALEA":"ES-PM","IT-RSARDEGNA":"IT-88","FR-RCORSE":"FR-COR","ES-RLARIOJA":"ES-LO","ES-RCASTILLALA":"ES-CM","IT-RUMBRIA":"IT-55","FR-RCENTREVALD":"FR-CVL","FR-RILEDEFRANC":"FR-IDF","ES-RMADRID":"ES-MD"};
const isoEstado = id => ISO_REGIAO[id] || id;
const urlBandeira = arq => `https://commons.wikimedia.org/wiki/Special:FilePath/${arq}?width=160`;
let albumCompleto = (() => { try { return localStorage.getItem('poa-album') !== '0'; } catch { return true; } })();
async function abreBandeiras(abaInicial = 'paises') {
  calcula();
  const vis = idsVisita();
  const ord = ids => [...ids].sort((a, b) => nomePais(a).localeCompare(nomePais(b), 'pt-BR'));
  // classe do cartão: visitado, quero ir ou falta (cinza, só no álbum completo)
  const estado = (set, quero, id) => set.has(id) ? '' : quero.has(id) ? ' quero' : ' falta';
  const card = id => `<button class="band-card${estado(paisesVis, paisesQuero, id)}" data-pais="${esc(id)}"><span>${bandeira(id)}</span><small>${esc(nomePais(id))}</small></button>`;
  // estados de cada país com algum estado visitado (o álbum mostra todos eles)
  const paisesComEstado = new Set([...estadosVis].map(id => S.estadoPorId.get(id)?.pais).filter(Boolean));
  const paisCasa = casa()?.pais || 'BR'; paisesComEstado.add(paisCasa);
  const todosEstados = S.estados.filter(e => paisesComEstado.has(e.pais)).map(e => e.id);
  let arquivos = {};
  {
    const codigos = [...new Set([...todosEstados, ...estadosQuero].map(isoEstado))].concat(CAPITAIS.map(c => 'ibge:' + c));
    for (let i = 0; i < codigos.length; i += 150) {
      const { data } = await supa.from('viagem_bandeiras').select('codigo,arquivo').in('codigo', codigos.slice(i, i + 150));
      (data || []).forEach(r => arquivos[r.codigo] = r.arquivo);
    }
  }
  const imgBand = (arq, reserva) => arq ? `<img src="${urlBandeira(arq)}" alt="" loading="lazy" onerror="this.outerHTML='<span>${reserva}</span>'">` : `<span>${reserva}</span>`;
  const cardEstado = id => {
    const pais = S.estadoPorId.get(id)?.pais;
    return `<button class="band-card estado${estado(estadosVis, estadosQuero, id)}" data-estado="${esc(id)}">${imgBand(arquivos[isoEstado(id)], bandeira(pais))}<small>${esc(nomeEstado(id))}</small></button>`;
  };
  const porNome = (a, b) => nomeEstado(a).localeCompare(nomeEstado(b), 'pt-BR');
  const htmlEstados = () => {
    let h = '';
    const grupos = [...paisesComEstado].sort((a, b) => (b === paisCasa) - (a === paisCasa) || nomePais(a).localeCompare(nomePais(b), 'pt-BR'));
    for (const p of grupos) {
      const ids = S.estados.filter(e => e.pais === p).map(e => e.id), feitos = ids.filter(id => estadosVis.has(id));
      if (!feitos.length && !albumCompleto) continue;
      const mostrar = albumCompleto ? ids : feitos;
      h += `<div class="grupo-band"><span>${bandeira(p)} ${esc(nomePais(p))}</span><span>${feitos.length} de ${ids.length}</span></div>`;
      h += `<div class="bandeiras">${mostrar.sort((a, b) => estadosVis.has(b) - estadosVis.has(a) || porNome(a, b)).map(cardEstado).join('')}</div>`;
    }
    const outros = [...estadosQuero].filter(id => !paisesComEstado.has(S.estadoPorId.get(id)?.pais));
    if (outros.length) h += `<h4>Quero ir</h4><div class="bandeiras">${outros.sort(porNome).map(cardEstado).join('')}</div>`;
    return h || '<p>Nenhum estado visitado ainda.</p>';
  };
  const htmlPaises = () => {
    let h = '';
    if (albumCompleto) {
      // álbum por continente: todos os países dos continentes onde você já esteve
      const conts = new Map();
      S.paises.forEach(p => { const c = CONTINENTES[p.continente] || 'Outros'; if (!conts.has(c)) conts.set(c, []); conts.get(c).push(p.id); });
      const visitados = [...conts].filter(([, ids]) => ids.some(id => paisesVis.has(id))).sort((a, b) => b[1].filter(id => paisesVis.has(id)).length - a[1].filter(id => paisesVis.has(id)).length);
      for (const [c, ids] of visitados) {
        const feitos = ids.filter(id => paisesVis.has(id)).length;
        h += `<div class="grupo-band"><span>${esc(c)}</span><span>${feitos} de ${ids.length}</span></div>`;
        h += `<div class="bandeiras">${ord(ids).sort((a, b) => paisesVis.has(b) - paisesVis.has(a)).map(card).join('')}</div>`;
      }
      const jaMostrados = new Set(visitados.flatMap(([, ids]) => ids));
      const quero = ord(paisesQuero).filter(id => !jaMostrados.has(id));
      if (quero.length) h += `<h4>Quero ir</h4><div class="bandeiras">${quero.map(card).join('')}</div>`;
      return h || '<p>Nenhum país visitado ainda.</p>';
    }
    return `<div class="bandeiras">${ord(paisesVis).map(card).join('')}</div>
      ${paisesQuero.size ? `<h4>Quero ir</h4><div class="bandeiras">${ord(paisesQuero).map(card).join('')}</div>` : ''}`;
  };
  // capitais brasileiras (bandeira municipal da Wikidata)
  const capVisitadas = new Set(S.lugares.filter(l => l.tipo === 'cidade' && l.ref_externa?.startsWith('ibge:') && visitado(l.id, vis)).map(l => l.ref_externa.slice(5)).filter(c => CAPITAIS.includes(c)));
  const htmlCapitais = () => {
    const mun = S.munPorCod;
    const lista = CAPITAIS.filter(c => albumCompleto || capVisitadas.has(c))
      .map(c => ({ c, nome: mun?.get(c)?.nome || '', uf: mun?.get(c)?.uf || '' }))
      .sort((a, b) => capVisitadas.has(b.c) - capVisitadas.has(a.c) || a.nome.localeCompare(b.nome, 'pt-BR'));
    return `<div class="grupo-band"><span>🇧🇷 Capitais do Brasil</span><span>${capVisitadas.size} de 27</span></div>
      <div class="bandeiras">${lista.map(({ c, nome, uf }) => `<button class="band-card estado${capVisitadas.has(c) ? '' : ' falta'}" data-cap="${c}">${imgBand(arquivos['ibge:' + c], '🏙️')}<small>${esc(nome)}${uf ? ' · ' + uf : ''}</small></button>`).join('') || '<p>Nenhuma capital ainda.</p>'}</div>`;
  };
  await carregaMunicipios().catch(() => {});
  abreModal(`
    <h3>Minhas bandeiras</h3>
    <div class="abas-band" role="tablist">
      <button role="tab" data-aba-band="paises">Países <b>${paisesVis.size}</b></button>
      <button role="tab" data-aba-band="estados">Estados <b>${estadosVis.size}</b></button>
      <button role="tab" data-aba-band="capitais">Capitais <b>${capVisitadas.size}</b></button>
      <button role="tab" data-aba-band="mapa">Mapa</button>
    </div>
    <div class="band-opcoes"></div>
    <div id="band-corpo"></div>
    <div class="acoes"><button class="btn" id="bd-fechar">Fechar</button></div>`, (m, fechar) => {
    let abaAtual = abaInicial, mapaModo = 'paises';
    const opcoes = m.querySelector('.band-opcoes');
    const mostra = aba => {
      abaAtual = aba;
      m.querySelectorAll('[data-aba-band]').forEach(b => b.setAttribute('aria-selected', b.dataset.abaBand === aba));
      opcoes.innerHTML = aba === 'mapa'
        ? `<div class="seg"><button data-modo="paises" aria-pressed="${mapaModo === 'paises'}">Países</button>${[...paisesComEstado].sort((a, b) => (b === paisCasa) - (a === paisCasa) || nomePais(a).localeCompare(nomePais(b), 'pt-BR')).map(p => `<button data-modo="estados:${p}" aria-pressed="${mapaModo === 'estados:' + p}" title="Estados de ${esc(nomePais(p))}">${bandeira(p)}</button>`).join('')}</div>`
        : `<label class="album"><input type="checkbox" ${albumCompleto ? 'checked' : ''}> Mostrar as que faltam</label>`;
      const corpo = m.querySelector('#band-corpo');
      corpo.innerHTML = aba === 'paises' ? htmlPaises() : aba === 'estados' ? htmlEstados() : aba === 'capitais' ? htmlCapitais() : '<canvas class="mapa-band"></canvas>';
      if (aba === 'mapa') desenhaMapaBandeiras(m.querySelector('.mapa-band'), mapaModo, arquivos);
      opcoes.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => { mapaModo = b.dataset.modo; mostra('mapa'); });
      const chk = opcoes.querySelector('.album input');
      if (chk) chk.onchange = () => { albumCompleto = chk.checked; try { localStorage.setItem('poa-album', albumCompleto ? '1' : '0'); } catch {} mostra(abaAtual); };
      m.querySelectorAll('[data-pais]').forEach(b => b.onclick = () => { fechar(); const p = S.paisPorId.get(b.dataset.pais); S.aba = 'paises'; atualizaTudo(); if (p) mapa.fitBounds([[p.maior[1], p.maior[0]], [p.maior[3], p.maior[2]]]); });
      m.querySelectorAll('[data-estado]').forEach(b => b.onclick = () => { fechar(); const e = S.estadoPorId.get(b.dataset.estado); S.aba = 'estados'; atualizaTudo(); if (e) mapa.fitBounds([[e.bbox[1], e.bbox[0]], [e.bbox[3], e.bbox[2]]]); });
      m.querySelectorAll('[data-cap]').forEach(b => b.onclick = () => { const x = S.munPorCod?.get(b.dataset.cap); if (!x) return; fechar(); S.aba = 'cidade'; atualizaTudo(); mapa.setView([x.lat, x.lon], 11); });
    };
    m.querySelectorAll('[data-aba-band]').forEach(b => b.onclick = () => mostra(b.dataset.abaBand));
    m.querySelector('#bd-fechar').onclick = fechar;
    mostra(abaInicial);
  });
}

/* ================= Compartilhar ================= */
async function abreCompartilhar() {
  let { data: reg } = await supa.from('viagem_compartilhar').select('*').maybeSingle();
  const link = () => `${location.origin}/?v=${reg.token}`;
  const desenhar = m => {
    m.querySelector('#cp-corpo').innerHTML = !reg ? `
      <p>Crie um link para mostrar seu mapa a quem você quiser. Quem abrir vê o mapa, as listas, as estatísticas e as bandeiras, sem poder mudar nada.</p>
      <p class="meta">Notas e datas das visitas não aparecem no link.</p>
      <div class="campo"><label for="cp-nome">Seu nome no mapa</label><input id="cp-nome" placeholder="Ex.: Lucas"></div>
      <div class="acoes"><button class="btn" id="cp-fechar">Fechar</button><button class="btn principal" id="cp-criar">Criar link</button></div>` : `
      <div class="campo"><label for="cp-link">Seu link</label><input id="cp-link" readonly value="${esc(link())}"></div>
      <div class="acoes" style="justify-content:flex-start"><button class="btn principal" id="cp-copiar">Copiar link</button>${navigator.share ? '<button class="btn" id="cp-enviar">Enviar…</button>' : ''}</div>
      <div class="campo"><label for="cp-nome">Seu nome no mapa</label><input id="cp-nome" value="${esc(reg.nome || '')}"></div>
      <label class="meta" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cp-ativo" ${reg.ativo ? 'checked' : ''}> Link ativo (desmarque para ninguém mais conseguir abrir)</label>
      <div class="acoes"><button class="btn" id="cp-fechar">Fechar</button></div>`;
    m.querySelector('#cp-fechar').onclick = () => m.closest('.fundo').remove();
    if (!reg) {
      m.querySelector('#cp-criar').onclick = async () => {
        const { data, error } = await supa.from('viagem_compartilhar').insert({ nome: m.querySelector('#cp-nome').value.trim() || null }).select().single();
        if (error) return toast('Erro: ' + error.message);
        reg = data; desenhar(m);
      };
      return;
    }
    m.querySelector('#cp-copiar').onclick = async () => {
      try { await navigator.clipboard.writeText(link()); toast('Link copiado'); }
      catch { const i = m.querySelector('#cp-link'); i.select(); toast('Selecionei o link: é só copiar'); }
    };
    const env = m.querySelector('#cp-enviar');
    if (env) env.onclick = () => navigator.share({ title: 'Meu mapa de viagens', text: 'Olha por onde eu já andei:', url: link() }).catch(() => {});
    m.querySelector('#cp-nome').onchange = async e => { const { error } = await supa.from('viagem_compartilhar').update({ nome: e.target.value.trim() || null }).eq('user_id', reg.user_id); if (error) toast('Erro: ' + error.message); else toast('Nome salvo'); };
    m.querySelector('#cp-ativo').onchange = async e => { const { error } = await supa.from('viagem_compartilhar').update({ ativo: e.target.checked }).eq('user_id', reg.user_id); if (error) return toast('Erro: ' + error.message); reg.ativo = e.target.checked; toast(reg.ativo ? 'Link ativado' : 'Link desativado'); };
  };
  abreModal(`<h3>Compartilhar meu mapa</h3><div id="cp-corpo"></div>`, m => desenhar(m));
}

/* ================= Backup ================= */
function baixarArquivo(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
function abreBackup() {
  const hoje = new Date().toISOString().slice(0, 10);
  abreModal(`
    <h3>Baixar meus dados</h3>
    <p>Uma cópia de tudo o que você marcou: lugares, rótulos, datas e notas. Guarde no Drive ou no computador.</p>
    <div class="menu-lista">
      <button id="bk-csv">Planilha (CSV)<small>Abre no Excel e no Google Planilhas</small></button>
      <button id="bk-json">Cópia completa (JSON)<small>Serve para restaurar tudo no app depois</small></button>
    </div>
    <div class="acoes"><button class="btn" id="bk-fechar">Fechar</button></div>`, (m, fechar) => {
    m.querySelector('#bk-fechar').onclick = fechar;
    m.querySelector('#bk-json').onclick = () => {
      const dados = { app: 'Por Onde Andei', versao: 2, gerado_em: new Date().toISOString(), rotulos: S.rotulos, lugares: S.lugares,
        marcas: [...S.lr].flatMap(([l, mm]) => [...mm.keys()].map(r => ({ lugar_id: l, rotulo_id: r }))), visitas: S.visitas || [], viagens: S.viagens || [], paradas: S.paradas || [], voos: S.voos || [] };
      baixarArquivo(`por-onde-andei-${hoje}.json`, JSON.stringify(dados, null, 2), 'application/json');
      toast('Cópia baixada');
    };
    m.querySelector('#bk-csv').onclick = () => {
      const c = v => { const t = String(v ?? ''); return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
      const linhas = [['Tipo', 'Nome', 'Estado', 'País', 'Rótulos', 'Visitas', 'Notas', 'Latitude', 'Longitude', 'Referência'].join(';')];
      for (const l of [...S.lugares].sort((a, b) => (a.pais || '').localeCompare(b.pais || '') || (a.estado || '').localeCompare(b.estado || '') || a.nome.localeCompare(b.nome, 'pt-BR'))) {
        const rots = S.rotulos.filter(r => rotulosDe(l.id).has(r.id)).map(r => r.nome).join(', ');
        const vis = visitasDe(l.id).reverse().map(fmtVisita).join(', ');
        linhas.push([ehParque(l) ? 'Parque nacional' : TIPOS[l.tipo].um, l.nome, nomeEstado(l.estado), nomePais(l.pais), rots, vis, l.notas, l.lat, l.lon, l.ref_externa].map(c).join(';'));
      }
      baixarArquivo(`por-onde-andei-${hoje}.csv`, '\uFEFF' + linhas.join('\r\n'), 'text/csv;charset=utf-8');
      toast('Planilha baixada');
    };
  });
}

/* ================= Imagem para compartilhar ================= */
async function geraCard() {
  calcula();
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  try { await document.fonts?.ready; } catch {}
  const fd = getComputedStyle(document.documentElement).getPropertyValue('--f-display').trim() || 'sans-serif';
  const fb = getComputedStyle(document.documentElement).getPropertyValue('--f-body').trim() || 'sans-serif';
  const caixa = (x, y, w, h, r) => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
  c.fillStyle = '#123a3f'; c.fillRect(0, 0, W, H);
  // mapa-múndi em projeção simples; países visitados e estados visitados em destaque
  const mx = 40, my = 220, mw = W - 80, mh = mw * 0.5;
  const px = lon => mx + (lon + 180) / 360 * mw, py = lat => my + (90 - lat) / 180 * mh;
  c.save(); caixa(mx, my, mw, mh, 28); c.clip();
  c.fillStyle = '#0e2c30'; c.fillRect(mx, my, mw, mh);
  const desenha = (f, cor) => { c.fillStyle = cor; c.beginPath(); for (const p of f.polys) for (const anel of p) { anel.forEach(([x, y], i) => i ? c.lineTo(px(x), py(y)) : c.moveTo(px(x), py(y))); c.closePath(); } c.fill('evenodd'); };
  S.paises.forEach(p => desenha(p, paisesVis.has(p.id) ? '#2fb3a3' : '#2a4a4e'));
  S.estados.filter(e => estadosVis.has(e.id)).forEach(e => desenha(e, '#7fe3d5'));
  c.restore();
  c.fillStyle = '#f2e8d5'; c.font = `800 72px ${fd}`; c.fillText(S.publico && S.nomePublico ? `Viagens de ${S.nomePublico}` : 'Por onde andei', 60, 130);
  c.fillStyle = '#e4572e'; c.font = `600 34px ${fb}`; c.fillText(`${paisesVis.size} ${paisesVis.size === 1 ? 'país' : 'países'} · ${estadosVis.size} estados`, 60, 185);
  const vis = idsVisita(), cont = { cidade: 0, unesco: 0, aeroporto: 0, atracao: 0 };
  const so = idsSoLugar();
  S.lugares.forEach(l => { if ((visitado(l.id, vis) || soLugar(l.id, so)) && l.tipo in cont) cont[l.tipo]++; });
  // núcleo do app: cidades, aeroportos, estados do país de casa e municípios (fora do Brasil, continentes)
  const pc = (!S.publico && casa()?.pais) || 'BR', ests = S.estados.filter(e => e.pais === pc);
  const mun = new Set(S.lugares.filter(l => l.tipo === 'cidade' && l.ref_externa?.startsWith('ibge:') && visitado(l.id, vis)).map(l => l.ref_externa));
  const conts = new Set(S.paises.filter(p => paisesVis.has(p.id)).map(p => CONTINENTES[p.continente]).filter(Boolean));
  const itens = [[cont.cidade, 'cidades'], [cont.aeroporto, 'aeroportos'],
    [`${ests.filter(e => estadosVis.has(e.id)).length}/${ests.length}`, `estados ${pc === 'BR' ? 'do Brasil' : 'de ' + nomePais(pc)}`],
    mun.size ? [mun.size, 'municípios do Brasil'] : [conts.size, conts.size === 1 ? 'continente' : 'continentes']];
  const by = my + mh + 50, bw = (W - 120 - 30) / 2, bh = 150;
  itens.forEach(([n, t], i) => {
    const x = 60 + (i % 2) * (bw + 30), y = by + Math.floor(i / 2) * (bh + 30);
    c.fillStyle = '#0e2c30'; caixa(x, y, bw, bh, 24); c.fill();
    c.fillStyle = '#f2e8d5'; c.font = `800 76px ${fd}`; c.fillText(String(n), x + 34, y + 86);
    c.fillStyle = '#9fc3c0'; c.font = `500 30px ${fb}`; c.fillText(t, x + 34, y + 128);
  });
  // os 3 selos mais altos
  try {
    const ORD = ['cobre', 'bronze', 'prata', 'ouro', 'platina', 'diamante'];
    const COR = { cobre: ['#d7895f', '#9a4f2c'], bronze: ['#e3a26b', '#b5733e'], prata: ['#e4e9ec', '#8e9aa3'], ouro: ['#f5d76e', '#d4a017'], platina: ['#f2f6f8', '#9fb4c2'], diamante: ['#c9f3ff', '#3fb7e0'] };
