<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Por Onde Andei</title>
<meta name="theme-color" content="#123a3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: barra superior + contadores; mapa em cima e lista embaixo no celular, lista lateral no computador */
:root {
  --bg: #eef2f1; --surface: #ffffff; --surface-2: #f6f8f8; --ink: #10292c; --muted: #5b6f71; --line: #d8e1e0;
  --primary: #123a3f; --on-primary: #f2e8d5; --accent: #e4572e; --visit: #0f8b7d; --want: #e9b949;
  --map-bg: #dfe8e7; --map-border: #9fb3b2; --danger: #c2372b;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
  color-scheme: light;
}
/* App segue o tema do aparelho; o mapa fica sempre claro (--map-* não mudam) */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1719; --surface: #122326; --surface-2: #0f1e20; --ink: #e4eeed; --muted: #8fa5a6; --line: #22393c;
  --primary: #0e2c30; --on-primary: #f2e8d5; --accent: #f06a43; --visit: #2fb3a3; --want: #e9b949;
  --danger: #ef6b5e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1719; --surface: #122326; --surface-2: #0f1e20; --ink: #e4eeed; --muted: #8fa5a6; --line: #22393c;
  --primary: #0e2c30; --on-primary: #f2e8d5; --accent: #f06a43; --visit: #2fb3a3; --want: #e9b949;
  --danger: #ef6b5e; color-scheme: dark; }
:root[data-theme="dark"] .item .tipo { color: var(--on-primary); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .item .tipo { color: var(--on-primary); } }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- App shell ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
.topo { background: var(--primary); color: var(--on-primary); display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; }
.topo h1 { font: 800 1.2rem/1 var(--f-display); letter-spacing: -.01em; margin: 0 auto 0 4px; white-space: nowrap; }
.topo h1 span { color: var(--accent); }
.btn-icone { background: none; border: 0; color: inherit; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.btn-icone:hover { background: rgba(255,255,255,.08); }
.btn-icone svg { width: 22px; height: 22px; }

.busca { position: relative; flex: 1; max-width: 520px; }
.busca input { width: 100%; border: 0; border-radius: 999px; padding: 9px 14px 9px 38px; background: rgba(255,255,255,.12); color: var(--on-primary); }
.busca input::placeholder { color: rgba(242,232,213,.7); }
.busca svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; opacity: .8; }
.resultados { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); color: var(--ink);
  border-radius: var(--r); box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 1200; max-height: 60vh; overflow: auto; }
.resultados button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.resultados button:hover { background: var(--surface-2); }
.resultados small { display: block; color: var(--muted); font-size: .8rem; }
.resultados .vazio { padding: 12px 14px; color: var(--muted); }
.resultados .grupo-busca { padding: 8px 14px 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; background: var(--surface-2); }
.resultados .mundo b { color: var(--accent); }
.aviso-mun { background: color-mix(in srgb, var(--want) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--want) 55%, transparent); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; font-size: .9rem; }
.aviso-mun span { color: var(--muted); }

.contadores { display: flex; gap: 2px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.contadores::-webkit-scrollbar { display: none; }
.contador { flex: 1 0 auto; border: 0; background: none; padding: 8px 12px; display: grid; justify-items: center; gap: 0; min-width: 76px; border-bottom: 2px solid transparent; }
.contador b { font: 800 1.15rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.contador b small { font: 600 .75rem var(--f-body); color: var(--muted); }
.contador span { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
.contador[aria-pressed="true"] { border-bottom-color: var(--accent); }

.corpo { display: grid; grid-template-rows: minmax(0, 52fr) minmax(0, 48fr); grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; }
#app { min-width: 0; overflow-x: hidden; }
@media (min-width: 900px) { .corpo { grid-template-rows: none; grid-template-columns: minmax(0,1fr) 420px; } }
#mapa { min-height: 0; background: var(--map-bg); position: relative; }
.painel { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--line); }
@media (min-width: 900px) { .painel { border-top: 0; border-left: 1px solid var(--line); } }

.painel-topo { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.painel-topo h2 { font: 700 1rem var(--f-display); margin: 0; flex: 1; min-width: 0; }
.painel-topo input { width: 46%; max-width: 200px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .9rem; }
.cab-rotulos { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; justify-content: flex-start; min-width: 0; font-size: .8rem; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cab-rotulos span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.cab-rotulos i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--c); flex: none; }
.lista { overflow-y: auto; flex: 1; padding-bottom: env(safe-area-inset-bottom, 0px); }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.item .tipo { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--primary); border: 1px solid var(--line); }
.item .tipo svg { width: 16px; height: 16px; }
.item .txt { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; }
.item .txt b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .txt small { display: block; color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marcas { display: flex; gap: 6px; flex: none; }
.marca { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--c); background: transparent; display: grid; place-items: center; padding: 0; }
.marca svg { width: 16px; height: 16px; color: #fff; opacity: 0; }
.marca[aria-pressed="true"] { background: var(--c); }
.marca[aria-pressed="true"] svg { opacity: 1; }
.vazio-lista { padding: 28px 20px; color: var(--muted); text-align: center; }
.vazio-lista b { display: block; color: var(--ink); font: 700 1.05rem var(--f-display); margin-bottom: 4px; }
.no-mapa { padding: 8px 12px; font-size: .82rem; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.no-mapa button { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; white-space: nowrap; }
.grupo { padding: 10px 12px 4px; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.bandeira { font-size: 1.2rem; width: 30px; text-align: center; flex: none; }

/* FAB */
.fab { position: absolute; right: 12px; bottom: 12px; z-index: 900; background: var(--accent); color: #fff; border: 0; border-radius: 999px;
  padding: 10px 16px 10px 12px; display: flex; align-items: center; gap: 6px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.fab svg { width: 20px; height: 20px; }
.aviso-mapa { position: absolute; left: 50%; top: 12px; translate: -50% 0; z-index: 900; background: var(--primary); color: var(--on-primary);
  padding: 8px 14px; border-radius: 999px; font-size: .88rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.aviso-mapa button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }
.mira #mapa .leaflet-container { cursor: crosshair; }

/* Leaflet ajustes */
.leaflet-container { background: var(--map-bg); font-family: var(--f-body); }
.rot-mapa { background: none !important; border: 0 !important; }
.rot-mapa div { font: 600 11px/1.1 var(--f-body); color: var(--muted); text-align: center; white-space: nowrap; translate: -50% -50%; width: max-content;
  text-shadow: 0 0 3px var(--map-bg), 0 0 3px var(--map-bg), 0 0 2px var(--map-bg); pointer-events: none; text-transform: uppercase; letter-spacing: .06em; }
.rot-mapa.estado div { font-size: 10px; font-weight: 500; letter-spacing: .04em; }
.rot-mapa.visitado div { color: var(--ink); }
.t1, .t2, .t3, .e1, .e2 { display: none; }
.z3 .t1, .z4 .t1, .z4 .t2, .z5 .t1, .z5 .t2, .z5 .t3 { display: block; }
.z5 .e1, .z6 .e1, .z6 .e2 { display: block; }
.z6 .rot-mapa.pais div { opacity: .55; }
.pino { background: none; border: 0; }
.pino div { width: 22px; height: 22px; border-radius: 50%; background: var(--c); border: 2px solid #fff; display: grid; place-items: center; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); translate: -50% -50%; }
.pino.base div { background: #fff; color: var(--cb); border: 2px solid var(--cb); width: 20px; height: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.25); opacity: .9; }
.pino div.cat { border: 3px solid var(--c); width: 24px; height: 24px; }
.pino.base div svg { width: 11px; height: 11px; }
.item.base .txt b { font-weight: 500; }
.ctl-local a { display: grid !important; place-items: center; color: #1a73e8 !important; }
.ctl-local a svg { width: 18px; height: 18px; }
.ctl-local.buscando a svg { animation: pisca 1s infinite; }
@keyframes pisca { 50% { opacity: .3; } }
.pino.cidade div { width: 24px; height: 24px; background: #fff; border: 3px solid var(--c); font-size: 15px; line-height: 1; }
.pino div svg { width: 12px; height: 12px; }
.pino div.band { overflow: hidden; }
.leaflet-tooltip.rot-lugar { background: var(--surface); color: var(--ink); border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 11px; padding: 2px 6px; }
.leaflet-tooltip.rot-lugar::before { display: none; }
.leaflet-control-attribution { font-size: 9px; background: color-mix(in srgb, var(--surface) 75%, transparent) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line); }

/* ---------- Modais ---------- */
.fundo { position: fixed; inset: 0; background: rgba(5,15,16,.55); z-index: 2000; display: grid; place-items: end center; }
@media (min-width: 600px) { .fundo { place-items: center; } }
.modal { background: var(--surface); width: min(100%, 520px); max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 600px) { .modal { border-radius: 16px; } }
.modal h3 { font: 800 1.25rem/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.modal p { margin: 0; color: var(--muted); }
.campo { display: grid; gap: 4px; }
.campo label, .rotulo-campo { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.campo textarea { min-height: 70px; resize: vertical; }
.linha { display: flex; gap: 10px; flex-wrap: wrap; }
.linha > * { flex: 1 1 140px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--c); background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--c); color: #fff; }
.acoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.btn.principal { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.perigo { color: var(--danger); margin-right: auto; }
.btn.perigo.armado { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
.meta { font-size: .82rem; color: var(--muted); }
.menu-lista { display: grid; gap: 4px; }
.menu-lista button { text-align: left; border: 0; background: var(--surface-2); padding: 12px 14px; border-radius: 8px; font-weight: 600; }
.menu-lista button small { display: block; font-weight: 400; color: var(--muted); }
.rot-edit { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rot-edit input[type=color] { width: 40px; height: 36px; padding: 0; border: 0; background: none; }
.rot-edit input[type=text] { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
.rot-edit .conta { grid-column: 2 / 4; font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.resumo-import { background: var(--surface-2); border-radius: 8px; padding: 12px; font-size: .9rem; display: grid; gap: 4px; }
.resumo-import ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); max-height: 180px; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; z-index: 3000; font-size: .9rem; box-shadow: 0 6px 18px rgba(0,0,0,.3); max-width: calc(100% - 32px); }

/* ---------- Login ---------- */
.login { height: 100%; display: grid; place-items: center; padding: 24px 16px; background: var(--primary); color: var(--on-primary); }
.login .cartao { width: min(100%, 380px); display: grid; gap: 14px; }
.login img { width: 84px; height: 84px; border-radius: 20px; }
.login h1 { font: 800 2rem/1 var(--f-display); margin: 0; }
.login p { margin: 0; opacity: .8; }
.login input { width: 100%; border: 0; border-radius: 10px; padding: 12px 14px; background: rgba(255,255,255,.1); color: var(--on-primary); }
.login input::placeholder { color: rgba(242,232,213,.6); }
.login .btn.principal { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 12px; }
.login .link { background: none; border: 0; color: var(--on-primary); opacity: .85; text-decoration: underline; padding: 0; justify-self: start; }
.login .erro { color: #ffb4a6; font-size: .9rem; }
.carregando { height: 100%; display: grid; place-items: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="carregando" class="carregando">Carregando…</div>

<!-- Login -->
<section id="tela-login" class="login" hidden>
  <form class="cartao" id="form-login">
    <img src="icon-192.png" alt="">
    <h1>Por Onde Andei</h1>
    <p id="login-sub">Entre para ver seu mapa de viagens.</p>
    <input id="login-email" type="email" placeholder="E-mail" autocomplete="email" required>
    <input id="login-senha" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" minlength="6" required>
    <div class="erro" id="login-erro" hidden></div>
    <button class="btn principal" id="login-btn" type="submit">Entrar</button>
    <button class="link" id="login-alternar" type="button">Primeira vez? Criar conta</button>
    <button class="link" id="login-esqueci" type="button">Esqueci a senha</button>
  </form>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="topo">
    <h1>Por Onde <span>Andei</span></h1>
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar cidade, aeroporto, atração…" autocomplete="off" enterkeyhint="search">
      <div class="resultados" id="resultados" hidden></div>
    </div>
    <button class="btn-icone" id="btn-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>
  <nav class="contadores" id="contadores"></nav>
  <main class="corpo">
    <div id="mapa">
      <button class="fab" id="btn-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Lugar</button>
      <div class="aviso-mapa" id="aviso-mira" hidden>Toque no mapa onde fica o lugar <button id="cancelar-mira">Cancelar</button></div>
    </div>
    <section class="painel">
      <div class="painel-topo">
        <h2 id="painel-titulo">Cidades</h2>
        <input id="filtro" type="search" placeholder="Filtrar lista">
      </div>
      <div class="cab-rotulos" id="cab-rotulos"></div>
      <div class="lista" id="lista"></div>
    </section>
  </main>
</div>

<div id="modais"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

/* ================= Estatísticas e lista ================= */
function calcula() {
  const vis = idsVisita();
  paisesVis = new Set(); paisesQuero = new Set(); estadosVis = new Set(); estadosQuero = new Set();
  const cont = { cidade: 0, unesco: 0, aeroporto: 0, porto: 0, atracao: 0, outro: 0 };
  for (const l of S.lugares) {
    if (!S.lr.has(l.id)) continue;
    if (visitado(l.id, vis)) {
      cont[l.tipo]++;
      if (l.pais) paisesVis.add(l.pais); if (l.estado) estadosVis.add(l.estado);
    } else {
      if (l.pais) paisesQuero.add(l.pais); if (l.estado) estadosQuero.add(l.estado);
    }
  }
  return cont;
}
function atualizaTudo() {
  const c = calcula();

  document.querySelectorAll('.rot-mapa div[data-pais]').forEach(d => d.parentElement.classList.toggle('visitado', paisesVis.has(d.dataset.pais)));
  const totalPaises = S.paises.length;

    ['paises', `${paisesVis.size}<small>/${totalPaises}</small>`, 'Países'],

}

// A lista mostra só o que está visível no mapa (como no Places Been)
function noMapa() {

function avisoMapa(n, total) {

function renderLista() {

      const totais = new Map(); S.paises.forEach(p => { const ct = CONTINENTES[p.continente] || 'Outros'; totais.set(ct, (totais.get(ct) || 0) + 1); });
      for (const [ct, ids] of [...porCont].sort()) {

    // itens da base ainda não marcados, na parte do mapa que está na tela
    const base = basePorAba(aba);
    if (base.length) {
      const z = mapa ? mapa.getZoom() : 2;
      const outros = base.filter(b => !lugarDaRef(b.ref) && visivel(b) && (!f || norm(b.nome + ' ' + b.sub).includes(f)) && (aba !== 'transporte' || b.grande || z >= 6 || f));
      outros.sort((a, b) => (b.grande || 0) - (a.grande || 0) || a.nome.localeCompare(b.nome, 'pt-BR'));
      if (outros.length) html += `<div class="grupo"><span>${aba === 'unesco' ? 'Outros patrimônios nesta área' : 'Outros aeroportos nesta área'}</span><span>${outros.length}</span></div>`
        + outros.slice(0, 150).map(linhaBase).join('')
        + (outros.length > 150 ? `<div class="vazio-lista">Mais ${outros.length - 150}. Aproxime o mapa ou filtre pelo nome.</div>` : '');
    } else if (aba === 'unesco' || aba === 'transporte') {
      carregaBase(aba === 'unesco' ? 'unesco' : 'aeroporto').then(() => { renderLista(); desenhaBase(); }).catch(() => {});
    }
    if (!ls.length && todos.length) html += '<div class="vazio-lista"><b>Nenhum marcado nesta parte do mapa</b>Afaste o mapa ou toque em “Ver todos”.</div>';
    if (!html) html = f ? `<div class="vazio-lista"><b>Nada encontrado</b>Nenhum item com “${esc(S.filtro)}”.</div>`
      : `<div class="vazio-lista"><b>Nenhum item aqui ainda</b>Use a busca lá em cima, toque em “+ Lugar” ou segure o dedo no mapa para adicionar. Se tem dados do Places Been, use Menu › Importar.</div>`;
  }
  $('#lista').innerHTML = html;
}

function abreModal(html, aoMontar) {
  const fundo = document.createElement('div'); fundo.className = 'fundo';
  fundo.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  fundo.addEventListener('click', e => { if (e.target === fundo) fundo.remove(); });
  $('#modais').appendChild(fundo);
  const fechar = () => fundo.remove();
  aoMontar && aoMontar(fundo.querySelector('.modal'), fechar);

function botaoDuploToque(btn, acao, textoArmado = 'Toque de novo para confirmar') {
  let armado = false, original = btn.textContent, t;
  btn.addEventListener('click', () => {
    if (!armado) { armado = true; btn.classList.add('armado'); btn.textContent = textoArmado; t = setTimeout(() => { armado = false; btn.classList.remove('armado'); btn.textContent = original; }, 3500); return; }
    clearTimeout(t); acao();

}
/* ================= Municípios do Brasil (IBGE) ================= */
// Regra do app: no Brasil, "cidade" é só município oficial do IBGE.
let munPromessa = null;
function carregaMunicipios() {
  return munPromessa ||= fetch('municipios-br.json').then(r => r.json()).then(rows => {
    S.mun = rows.map(([cod, nome, uf, lat, lon]) => ({ cod: String(cod), nome, uf, lat, lon, n: norm(nome) }));
    S.munPorCod = new Map(S.mun.map(m => [m.cod, m]));
    return S.mun;
  }).catch(e => { munPromessa = null; throw e; });
}
const ufDe = estado => (estado || '').startsWith('BR-') ? estado.slice(3) : null;
const refIbge = m => 'ibge:' + m.cod;
function municipioPorNome(nome, uf) { const n = norm(nome); return S.mun?.find(m => m.n === n && (!uf || m.uf === uf)) || null; }
function municipiosProximos(lat, lon, qtd = 4) {
  return [...S.mun].map(m => ({ m, d: distKm(lat, lon, m.lat, m.lon) })).sort((a, b) => a.d - b.d).slice(0, qtd).map(x => x.m);
}
function buscaMunicipios(q, qtd = 6) {
  const n = norm(q); if (n.length < 2 || !S.mun) return [];
  const comeca = [], contem = [];
  for (const m of S.mun) { if (m.n.startsWith(n)) comeca.push(m); else if (m.n.includes(n)) contem.push(m); }
  return [...comeca, ...contem].slice(0, qtd);
}
const cidadeJaCadastrada = m => S.lugares.find(l => l.tipo === 'cidade' && (l.ref_externa === refIbge(m) || (norm(l.nome) === m.n && ufDe(l.estado) === m.uf)));

/* ================= Formulário de lugar ================= */
function formLugar({ titulo, l, rotSel, aoSalvar, aoExcluir, sugestoes }) {
  const loc = localizar(l.lat, l.lon, l.pais);
  const opcoesTipo = Object.entries(TIPOS).map(([k, v]) => `<option value="${k}" ${l.tipo === k ? 'selected' : ''}>${v.um}</option>`).join('');
  const chips = S.rotulos.map(r => `<button type="button" class="chip" style="--c:${esc(r.cor)}" data-r="${r.id}" aria-pressed="${rotSel.has(r.id)}">${esc(r.nome)}</button>`).join('');
  abreModal(`
    <h3>${esc(titulo)}</h3>
    ${sugestoes ? `<div class="campo"><span class="rotulo-campo">Sugestões de nome</span><div class="chips">${sugestoes.map(s => `<button type="button" class="chip sug" style="--c:var(--map-border)" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>` : ''}
    <div class="linha">
      <div class="campo" style="flex-basis:220px"><label for="f-nome">Nome</label><input id="f-nome" value="${esc(l.nome || '')}" placeholder="Ex.: Praia do Gunga"></div>
      <div class="campo"><label for="f-tipo">Tipo</label><select id="f-tipo">${opcoesTipo}</select></div>
    </div>
    <div class="aviso-mun" id="f-aviso" hidden></div>
    <div class="campo"><span class="rotulo-campo">Rótulos</span><div class="chips" id="f-chips">${chips}</div></div>
    <div class="campo"><label for="f-notas">Notas</label><textarea id="f-notas" placeholder="Quando foi, com quem, o que achou…">${esc(l.notas || '')}</textarea></div>
    <div class="meta">${esc([nomeEstado(loc.estado), nomePais(loc.pais)].filter(Boolean).join(', ') || 'Fora de qualquer país')} · ${l.lat.toFixed(4)}, ${l.lon.toFixed(4)}</div>
    <div class="acoes">
      ${aoExcluir ? '<button class="btn perigo" id="f-excluir" type="button">Excluir</button>' : ''}
      <button class="btn" id="f-cancelar" type="button">Cancelar</button>
      <button class="btn principal" id="f-salvar" type="button">Salvar</button>
    </div>`, (m, fechar) => {
    const sel = new Set(rotSel);
    const aviso = m.querySelector('#f-aviso'), campoNome = m.querySelector('#f-nome'), campoTipo = m.querySelector('#f-tipo');
    m.querySelectorAll('#f-chips .chip').forEach(b => b.onclick = () => { const r = b.dataset.r; sel.has(r) ? sel.delete(r) : sel.add(r); b.setAttribute('aria-pressed', sel.has(r)); });
    m.querySelectorAll('.chip.sug').forEach(b => b.onclick = () => { campoNome.value = b.dataset.s; aviso.hidden = true; });
    m.querySelector('#f-cancelar').onclick = fechar;
    campoNome.addEventListener('input', () => { aviso.hidden = true; });
    campoTipo.addEventListener('change', () => { aviso.hidden = true; });
    if (aoExcluir) botaoDuploToque(m.querySelector('#f-excluir'), async () => { await aoExcluir(); fechar(); });

    // No Brasil, cidade precisa ser município do IBGE
    async function confereMunicipio(nome) {
      if (campoTipo.value !== 'cidade' || loc.pais !== 'BR') return { ok: true, ref: l.ref_externa?.startsWith('ibge:') ? null : (l.ref_externa || null) };
      await carregaMunicipios();
      const uf = ufDe(loc.estado);
      const achou = municipioPorNome(nome, uf) || (l.ref_externa?.startsWith('ibge:') && norm(nome) === norm(S.munPorCod.get(l.ref_externa.slice(5))?.nome) ? S.munPorCod.get(l.ref_externa.slice(5)) : null);
      if (achou) return { ok: true, ref: refIbge(achou), nome: achou.nome, mun: achou };
      const perto = municipiosProximos(l.lat, l.lon, 4);
      aviso.hidden = false;
      aviso.innerHTML = `<b>“${esc(nome)}” não é município${uf ? ' de ' + esc(nomeEstado(loc.estado)) : ''}.</b>
        <span>Pela regra do app, só município conta como cidade. Escolha o município, ou salve como outro tipo de lugar.</span>
        <div class="chips">${perto.map(p => `<button type="button" class="chip" style="--c:var(--visit)" data-mun="${p.cod}">${esc(p.nome)} · ${p.uf}</button>`).join('')}
        <button type="button" class="chip" style="--c:var(--map-border)" data-outro="1">Salvar como Outro lugar</button></div>`;
      aviso.querySelectorAll('[data-mun]').forEach(b => b.onclick = () => { campoNome.value = S.munPorCod.get(b.dataset.mun).nome; aviso.hidden = true; });
      aviso.querySelector('[data-outro]').onclick = () => { campoTipo.value = 'outro'; aviso.hidden = true; };
      return { ok: false };
    }

    m.querySelector('#f-salvar').onclick = async ev => {
      let nome = campoNome.value.trim();
      if (!nome) { campoNome.focus(); return toast('Dá um nome pro lugar'); }
      ev.target.disabled = true;
      let conf;
      try { conf = await confereMunicipio(nome); } catch { conf = { ok: true, ref: l.ref_externa || null }; toast('Não deu pra conferir a lista do IBGE agora'); }
      if (!conf.ok) { ev.target.disabled = false; return; }
      if (conf.nome) nome = conf.nome;
      if (conf.mun) {
        const ja = cidadeJaCadastrada(conf.mun);
        if (ja && ja.id !== l.id) { ev.target.disabled = false; toast(`${ja.nome} já está na sua lista`); fechar(); return abreLugar(ja.id); }
      }
      const ok = await aoSalvar({ nome, tipo: campoTipo.value, notas: m.querySelector('#f-notas').value.trim() || null, pais: loc.pais, estado: loc.estado, ref_externa: conf.ref ?? null }, sel);
      if (ok) fechar(); else ev.target.disabled = false;
    };
    if (!l.nome) setTimeout(() => campoNome.focus(), 50);
  });
}
async function salvaRotulosDoLugar(id, sel) {
  const atual = rotulosDe(id);
  const tirar = [...atual.keys()].filter(r => !sel.has(r)), por = [...sel].filter(r => !atual.has(r));
  if (tirar.length) { const { error } = await supa.from('viagem_lugar_rotulos').delete().eq('lugar_id', id).in('rotulo_id', tirar); if (error) throw error; }
  if (por.length) { const { error } = await supa.from('viagem_lugar_rotulos').insert(por.map(r => ({ lugar_id: id, rotulo_id: r }))); if (error) throw error; }
  const m = new Map(); sel.forEach(r => m.set(r, atual.get(r) ?? null));
  if (m.size) S.lr.set(id, m); else S.lr.delete(id);
}
function novoLugar(dados, sugestoes) {
  const padrao = S.rotulos.find(r => r.conta_como_visita);
  formLugar({
    titulo: 'Novo lugar', l: dados, rotSel: new Set(padrao ? [padrao.id] : []), sugestoes,
    aoSalvar: async (v, sel) => {
      const reg = { tipo: v.tipo, nome: v.nome, notas: v.notas, lat: dados.lat, lon: dados.lon, pais: v.pais, estado: v.estado, ref_externa: v.ref_externa ?? dados.ref_externa ?? null };
      const { data, error } = await supa.from('viagem_lugares').insert(reg).select().single();
      if (error) { toast('Erro ao salvar: ' + error.message); return false; }
      S.lugares.push(data);
      try { await salvaRotulosDoLugar(data.id, sel); } catch (e) { toast('Lugar salvo, mas os rótulos falharam: ' + e.message); }
      S.aba = v.tipo === 'aeroporto' || v.tipo === 'porto' ? 'transporte' : v.tipo;
      atualizaTudo(); toast(`${v.nome} adicionado`);
      return true;
    },
  });
}
async function novoLugarEm(lat, lon) {
  let sugestoes = [], tipo = 'cidade';
  const loc = localizar(lat, lon);
  if (loc.pais === 'BR') {
    try { await carregaMunicipios(); sugestoes = municipiosProximos(lat, lon, 3).map(m => m.nome); } catch {}
  }
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=pt-BR`).then(r => r.json());
    const a = r.address || {};
    const cidade = a.city || a.town || a.municipality || a.village;
    if (loc.pais === 'BR') {
      // município oficial primeiro; o nome do ponto (praia, atração) depois
      const oficial = cidade && municipioPorNome(cidade, ufDe(loc.estado));
      if (oficial) sugestoes = [oficial.nome, ...sugestoes.filter(s => s !== oficial.nome)];
      if (r.name && r.name !== cidade) sugestoes.push(r.name);
    } else {
      sugestoes = [cidade, r.name].filter(Boolean);
    }
    tipo = r.name && r.name !== cidade ? tipoDoResultado(r) : 'cidade';
  } catch {}
  sugestoes = [...new Set(sugestoes)].slice(0, 5);
  novoLugar({ lat, lon, tipo, nome: '' }, sugestoes.length ? sugestoes : null);
}
function abreLugar(id) {
  const l = S.lugares.find(x => x.id === id); if (!l) return;
  mapa.setView([l.lat, l.lon], Math.max(mapa.getZoom(), 9));
  formLugar({
    titulo: l.nome, l, rotSel: new Set(rotulosDe(id).keys()),
    aoSalvar: async (v, sel) => {
      const mud = { nome: v.nome, tipo: v.tipo, notas: v.notas, pais: v.pais, estado: v.estado, ref_externa: v.ref_externa };
      const { error } = await supa.from('viagem_lugares').update(mud).eq('id', id);
      if (error) { toast('Erro ao salvar: ' + error.message); return false; }
      Object.assign(l, mud);
      try { await salvaRotulosDoLugar(id, sel); } catch (e) { toast('Erro nos rótulos: ' + e.message); }
      atualizaTudo(); toast('Salvo'); return true;
    },
    aoExcluir: async () => {
      const { error } = await supa.from('viagem_lugares').delete().eq('id', id);
      if (error) return toast('Erro ao excluir: ' + error.message);
      S.lugares = S.lugares.filter(x => x.id !== id); S.lr.delete(id); atualizaTudo(); toast(`${l.nome} excluído`);
    },
  });
}
function abreMunicipio(m) {
  $('#resultados').hidden = true; $('#busca').value = '';
  mapa.setView([m.lat, m.lon], 10);
  const ja = cidadeJaCadastrada(m);
  if (ja) return abreLugar(ja.id);
  novoLugar({ lat: m.lat, lon: m.lon, tipo: 'cidade', nome: m.nome, pais: 'BR', ref_externa: refIbge(m) });
}

/* ================= Busca ================= */
// Digitando: municípios do Brasil na hora (lista do IBGE).
// Enter ou "Buscar no mundo": OpenStreetMap em português, sem povoado nem bairro.
const NAO_CIDADE = new Set(['hamlet', 'isolated_dwelling', 'neighbourhood', 'suburb', 'quarter', 'city_block', 'locality', 'farm', 'croft', 'allotments', 'plot', 'borough', 'residential']);
function tipoDoResultado(r) {
  const c = r.category || r.class, t = r.type;
  if (c === 'aeroway') return 'aeroporto';
  if (t === 'harbour' || t === 'ferry_terminal' || t === 'port' || (c === 'landuse' && t === 'harbour')) return 'porto';
  if (c === 'place' || c === 'boundary') return NAO_CIDADE.has(t) || NAO_CIDADE.has(r.addresstype) ? 'outro' : 'cidade';
  if (['tourism', 'historic', 'leisure', 'natural', 'amenity', 'building', 'man_made'].includes(c)) return 'atracao';
  return 'outro';
}
function linhaMunicipio(m) {
  const ja = cidadeJaCadastrada(m);
  return `<button data-mun="${m.cod}"><b>${esc(m.nome)}</b><small>Município · ${esc(nomeEstado('BR-' + m.uf) || m.uf)}${ja ? ' · já está na sua lista' : ''}</small></button>`;
}
function ligaResultados(box, mundo) {
  box.querySelectorAll('[data-mun]').forEach(b => b.onclick = () => abreMunicipio(S.munPorCod.get(b.dataset.mun)));
  const bm = box.querySelector('[data-mundo]'); if (bm) bm.onclick = () => buscar($('#busca').value.trim());
  box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
    const x = mundo[+b.dataset.i]; box.hidden = true; $('#busca').value = '';
    const lat = +x.lat, lon = +x.lon; mapa.setView([lat, lon], 10);
    const nome = x.name || x.display_name.split(',')[0];
    const ja = S.lugares.find(l => norm(l.nome) === norm(nome) && distKm(l.lat, l.lon, lat, lon) < 15);
    if (ja) return abreLugar(ja.id);
    novoLugar({ lat, lon, tipo: tipoDoResultado(x), nome, pais: (x.address?.country_code || '').toUpperCase() });
  });
}
let digitaTimer;
function sugereEnquantoDigita(q) {
  clearTimeout(digitaTimer);
  const box = $('#resultados');
  if (q.trim().length < 2) { box.hidden = true; return; }
  digitaTimer = setTimeout(async () => {
    try { await carregaMunicipios(); } catch {}
    const ms = buscaMunicipios(q);
    box.hidden = false;
    box.innerHTML = (ms.length ? `<div class="grupo-busca">Municípios do Brasil</div>${ms.map(linhaMunicipio).join('')}` : '')
      + `<button data-mundo="1" class="mundo"><b>Buscar “${esc(q.trim())}” no mundo</b><small>Cidades de fora, aeroportos, portos, atrações</small></button>`;
    ligaResultados(box, []);
  }, 120);
}
let buscaSeq = 0;
async function buscar(q) {
  if (q.length < 2) return;
  clearTimeout(digitaTimer);
  const box = $('#resultados'); const seq = ++buscaSeq;
  try { await carregaMunicipios(); } catch {}
  const ms = buscaMunicipios(q, 4);
  const topo = ms.length ? `<div class="grupo-busca">Municípios do Brasil</div>${ms.map(linhaMunicipio).join('')}` : '';
  box.hidden = false; box.innerHTML = topo + '<div class="vazio">Buscando no mundo…</div>';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&limit=12&addressdetails=1&accept-language=pt-BR`).then(r => r.json());
    if (seq !== buscaSeq) return;
    // cidades do Brasil já vêm do IBGE; povoados e bairros não entram como cidade
    const mundo = r.filter(x => {
      const t = tipoDoResultado(x), cc = (x.address?.country_code || '').toUpperCase();
      if (t === 'cidade' && cc === 'BR') return false;
      if ((x.category || x.class) === 'place' && t === 'outro') return false;
      return true;
    }).slice(0, 8);
    const lista = mundo.map((x, i) => `<button data-i="${i}"><b>${esc(x.name || x.display_name.split(',')[0])}</b><small>${esc(TIPOS[tipoDoResultado(x)].um)} · ${esc(x.display_name.split(',').slice(1, 4).join(',').trim())}</small></button>`).join('');
    box.innerHTML = topo + (lista ? `<div class="grupo-busca">No mundo</div>${lista}` : (topo ? '' : '<div class="vazio">Nada encontrado. Tente outro nome ou segure o dedo no mapa.</div>'));
    ligaResultados(box, mundo);
  } catch {
    box.innerHTML = topo + '<div class="vazio">Sem conexão com a busca no mundo agora. Tente de novo em instantes.</div>';
    ligaResultados(box, []);
  }
}

/* ================= Importação do Places Been ================= */
// Ajustes conhecidos do export (nome em inglês, tipo errado, duplicados)
const CORRECOES = [
  { em: /airport|airpark|aeroparque|aeropuerto/i, tipo: 'aeroporto' },
  { em: /historic cent|national park|world heritage|unesco/i, tipo: 'unesco' },
];
const NOMES_PT = {
  'guarulhos governador andre franco montoro international airport': ['Aeroporto Internacional de Guarulhos (GRU)', 'iata:GRU'],
  'presidente juscelino kubistschek international airport': ['Aeroporto Internacional de Brasília (BSB)', 'iata:BSB'],
  'presidente juscelino kubitschek international airport': ['Aeroporto Internacional de Brasília (BSB)', 'iata:BSB'],
  'tancredo neves international airport': ['Aeroporto Internacional de Confins (CNF)', 'iata:CNF'],
  'afonso pena airport': ['Aeroporto Internacional Afonso Pena (CWB)', 'iata:CWB'],
  'zumbi dos palmares airport': ['Aeroporto Internacional Zumbi dos Palmares (MCZ)', 'iata:MCZ'],
  'jorge newbery airpark': ['Aeroparque Jorge Newbery (AEP)', 'iata:AEP'],
  'historic centre of the town of olinda': ['Centro Histórico de Olinda', 'unesco:189'],
  'la boca': ['La Boca (Caminito)', null, 'atracao'],
};
// Não são municípios (povoado / região administrativa): ficam fora
const IGNORAR = ['porto da rua', 'gama'];
// No Places Been, "Brasilia" sem acento nesse ponto é o patrimônio da UNESCO (Plano Piloto)
const ESPECIAIS = [{ nome: 'brasilia', lat: -15.78333, lon: -47.9, vira: ['Plano Piloto de Brasília', 'unesco', 'unesco:445'] }];
const PORTOS_EXTRAS = [
  { tipo: 'porto', nome: 'Porto de Maceió', lat: -9.6807, lon: -35.7268, pais: 'BR' },
  { tipo: 'porto', nome: 'Porto de Buenos Aires', lat: -34.5847, lon: -58.3699, pais: 'AR' },
];
function lerCSV(txt) {
  const linhas = txt.replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
  const sep = linhas[0].includes(';') ? ';' : ',';
  const cel = l => { const out = []; let cur = '', q = false; for (let i = 0; i < l.length; i++) { const c = l[i];
    if (q) { if (c === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === sep) { out.push(cur); cur = ''; } else cur += c; } out.push(cur); return out; };
  const cab = cel(linhas[0]).map(h => h.trim().toLowerCase());
  return linhas.slice(1).map(l => { const v = cel(l); const o = {}; cab.forEach((h, i) => o[h] = (v[i] || '').trim()); return o; });
}
function preparaImportacao(linhas, incluirPortos) {
  const notas = [], novos = [];
  const rotPorStatus = { been: S.rotulos.find(r => r.conta_como_visita) || S.rotulos[0], want: S.rotulos.find(r => norm(r.nome) === 'quero ir'), fave: S.rotulos.find(r => norm(r.nome) === 'favorito') };
  const brutos = linhas.map(x => ({ nomeOrig: x.city || x.name || '', lat: parseFloat(x.lat), lon: parseFloat(x.lon), pais: (x.country || '').toUpperCase(), status: (x.been || '').split(',').map(s => s.trim()).filter(Boolean) }))
    .filter(x => x.nomeOrig && isFinite(x.lat) && isFinite(x.lon));
  for (const b of brutos) {
    if (IGNORAR.includes(norm(b.nomeOrig)) && !S.mun) { notas.push(`${b.nomeOrig}: não é município, ficou de fora`); continue; }
    let tipo = 'cidade', nome = b.nomeOrig, ref = null;
    for (const c of CORRECOES) if (c.em.test(nome)) tipo = c.tipo;
    const fix = NOMES_PT[norm(nome)];
    if (fix) { if (fix[0] !== nome) notas.push(`${nome} → ${fix[0]}`); nome = fix[0]; ref = fix[1]; if (fix[2]) tipo = fix[2]; }
    for (const e of ESPECIAIS) if (norm(b.nomeOrig) === e.nome && distKm(b.lat, b.lon, e.lat, e.lon) < 1) { nome = e.vira[0]; tipo = e.vira[1]; ref = e.vira[2] || ref; notas.push(`${b.nomeOrig} (ponto da UNESCO) → ${nome}, patrimônio da UNESCO`); }
    novos.push({ ...b, tipo, nome, ref });
  }
  if (incluirPortos) PORTOS_EXTRAS.forEach(p => novos.push({ ...p, nomeOrig: p.nome, status: ['been'], ref: null }));
  // tira duplicados: mesmo tipo, nome parecido e perto (fica o nome mais completo; junta os rótulos)
  const finais = [];
  for (const n of novos) {
    const a = norm(n.nome);
    const dup = finais.find(f => f.tipo === n.tipo && distKm(f.lat, f.lon, n.lat, n.lon) < 15 && (norm(f.nome) === a || norm(f.nome).startsWith(a + ' ') || a.startsWith(norm(f.nome) + ' ')));
    if (dup) {
      // fica o nome mais completo; empate: o que tem acento
      const acento = s => /[^\x00-\x7F]/.test(s);
      const escolhido = n.nome.length > dup.nome.length ? n.nome : n.nome.length < dup.nome.length ? dup.nome : (acento(n.nome) && !acento(dup.nome) ? n.nome : dup.nome);
      notas.push(`Duplicado juntado: ${dup.nome} + ${n.nome} → ${escolhido}`);
      dup.nome = escolhido; dup.status = [...new Set([...dup.status, ...n.status])];
      continue;
    }
    finais.push({ ...n });
  }
  // já existentes no app
  const jaTem = [], inserir = [];
  for (const f of finais) {
    const ex = S.lugares.find(l => l.tipo === f.tipo && norm(l.nome) === norm(f.nome) && distKm(l.lat, l.lon, f.lat, f.lon) < 15);
    (ex ? jaTem : inserir).push(f);
  }
  const validos = [];
  for (const f of inserir) {
    const loc = localizar(f.lat, f.lon, f.pais); f.paisCalc = loc.pais; f.estadoCalc = loc.estado;
    f.rotulos = f.status.map(s => rotPorStatus[s]?.id).filter(Boolean);
    // Brasil: cidade só se for município do IBGE
    if (f.tipo === 'cidade' && loc.pais === 'BR' && S.mun) {
      const m = municipioPorNome(f.nome, ufDe(loc.estado));
      if (!m) { notas.push(`${f.nome}: não é município, ficou de fora`); continue; }
      if (cidadeJaCadastrada(m)) { jaTem.push(f); continue; }
      f.nome = m.nome; f.ref = refIbge(m);
    }
    validos.push(f);
  }
  return { inserir: validos, jaTem, notas, total: brutos.length };
}
function abreImportacao() {
  abreModal(`
    <h3>Importar do Places Been</h3>
    <p>Escolha o arquivo CSV exportado pelo Places Been. Nada é salvo antes de você confirmar.</p>
    <div class="campo"><label for="arq">Arquivo</label><input id="arq" type="file" accept=".csv,text/csv,text/plain"></div>
    <label class="meta" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="portos" checked> Incluir os portos de Maceió e Buenos Aires (o arquivo não traz portos)</label>
    <div id="previa"></div>
    <div class="acoes"><button class="btn" id="i-fechar">Cancelar</button><button class="btn principal" id="i-ok" disabled>Importar</button></div>`, (m, fechar) => {
    let plano = null, linhas = null;
    const prever = () => {
      if (!linhas) return;
      plano = preparaImportacao(linhas, m.querySelector('#portos').checked);
      const porTipo = {}; plano.inserir.forEach(f => porTipo[f.tipo] = (porTipo[f.tipo] || 0) + 1);
      const paises = new Set(plano.inserir.map(f => f.paisCalc).filter(Boolean)), estados = new Set(plano.inserir.map(f => f.estadoCalc).filter(Boolean));
      m.querySelector('#previa').innerHTML = `<div class="resumo-import">
        <b>${plano.inserir.length} lugares para importar</b>
        <span>${Object.entries(porTipo).map(([t, n]) => `${n} ${n === 1 ? TIPOS[t].um.toLowerCase() : TIPOS[t].curto.toLowerCase()}`).join(' · ')}</span>
        <span>${paises.size} ${paises.size === 1 ? 'país' : 'países'} e ${estados.size} estados</span>
        ${plano.jaTem.length ? `<span>${plano.jaTem.length} já estão no app e serão ignorados</span>` : ''}
        ${plano.notas.length ? `<details><summary>${plano.notas.length} ajustes automáticos</summary><ul>${plano.notas.map(n => `<li>${esc(n)}</li>`).join('')}</ul></details>` : ''}
      </div>`;
      m.querySelector('#i-ok').disabled = !plano.inserir.length;
    };
    m.querySelector('#i-fechar').onclick = fechar;
    m.querySelector('#portos').onchange = prever;
    m.querySelector('#arq').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { linhas = lerCSV(await f.text()); try { await carregaMunicipios(); } catch {} prever(); }
      catch { m.querySelector('#previa').innerHTML = '<div class="resumo-import">Não consegui ler esse arquivo. Confira se é o CSV do Places Been.</div>'; }
    };
    m.querySelector('#i-ok').onclick = async ev => {
      ev.target.disabled = true; ev.target.textContent = 'Importando…';
      try {
        const regs = plano.inserir.map(f => ({ tipo: f.tipo, nome: f.nome, lat: f.lat, lon: f.lon, pais: f.paisCalc, estado: f.estadoCalc, ref_externa: f.ref }));
        const { data, error } = await supa.from('viagem_lugares').insert(regs).select();
        if (error) throw error;
        const lr = [];
        data.forEach((d, i) => plano.inserir[i].rotulos.forEach(r => lr.push({ lugar_id: d.id, rotulo_id: r })));
        if (lr.length) { const { error: e2 } = await supa.from('viagem_lugar_rotulos').insert(lr); if (e2) throw e2; }
        await carregaDados(); atualizaTudo(); fechar();
        toast(`${data.length} lugares importados`, 3500);
        if (camadaPinos.getLayers().length) mapa.fitBounds(L.featureGroup(camadaPinos.getLayers()).getBounds().pad(0.1));
      } catch (e) { toast('Erro na importação: ' + e.message, 5000); ev.target.disabled = false; ev.target.textContent = 'Importar'; }
    };
  });
}

  let tLista; mapa.on('moveend', () => { clearTimeout(tLista); tLista = setTimeout(() => { renderLista(); desenhaBase(); }, 120); });
  $('#lista').addEventListener('click', e => {
    if (e.target.closest('[data-ver-todos]')) {
      const ls = camadaPinos.getLayers(); if (ls.length) mapa.fitBounds(L.featureGroup(ls).getBounds().pad(0.1)); else mapa.setView([0, 0], 2);
      return;
    }
    const mk = e.target.closest('.marca');
    if (mk) return mk.dataset.base ? marcaBase(mk.dataset.base, mk.dataset.r) : alternaRotulo(mk.dataset.l, mk.dataset.r);
    const abb = e.target.closest('[data-abrir-base]'); if (abb) return abreBase(abb.dataset.abrirBase);
    const ab = e.target.closest('[data-abrir]'); if (ab) return abreLugar(ab.dataset.abrir);
    const zp = e.target.closest('[data-zoom-pais]'); if (zp) { const p = S.paisPorId.get(zp.dataset.zoomPais); if (p) mapa.fitBounds([[p.maior[1], p.maior[0]], [p.maior[3], p.maior[2]]]); return; }
    const ze = e.target.closest('[data-zoom-estado]'); if (ze) { const p = S.estadoPorId.get(ze.dataset.zoomEstado); if (p) mapa.fitBounds([[p.bbox[1], p.bbox[0]], [p.bbox[3], p.bbox[2]]]); }
  });
  $('#filtro').addEventListener('input', e => { S.filtro = e.target.value; renderLista(); });
  $('#busca').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim().length > 1) buscar(e.target.value.trim()); if (e.key === 'Escape') $('#resultados').hidden = true; });
  $('#busca').addEventListener('input', e => sugereEnquantoDigita(e.target.value));
  $('#busca').addEventListener('search', e => { if (!e.target.value) $('#resultados').hidden = true; });
  document.addEventListener('click', e => { if (!e.target.closest('.busca')) $('#resultados').hidden = true; });
  $('#btn-menu').onclick = abreMenu;
  $('#btn-add').onclick = () => { S.modoMira = true; $('#aviso-mira').hidden = false; document.body.classList.add('mira'); };
  $('#cancelar-mira').onclick = e => { e.stopPropagation(); saiMira(); };
}

(async () => {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  carregaGeo().catch(() => {});
  carregaMunicipios().catch(() => {});
  supa.auth.onAuthStateChange((ev, sessao) => {
    if (ev === 'PASSWORD_RECOVERY') {
      abreModal(`<h3>Nova senha</h3><div class="campo"><label for="nova">Senha nova</label><input id="nova" type="password" minlength="6"></div><div class="acoes"><button class="btn principal" id="salvar-senha">Salvar</button></div>`, (m, fechar) => {
        m.querySelector('#salvar-senha').onclick = async () => { const { error } = await supa.auth.updateUser({ password: m.querySelector('#nova').value }); if (error) return toast('Erro: ' + error.message); fechar(); toast('Senha alterada'); };
      });
    }
    if (sessao?.user) entrar(sessao.user);
  });
  const { data } = await supa.auth.getSession();
  if (data.session?.user) entrar(data.session.user); else telaLogin();
})();
</script>
</body>
