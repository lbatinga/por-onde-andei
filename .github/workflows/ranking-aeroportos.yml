name: Bases mensais (aeroportos, museus, cidades e municípios)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 5 * *'   # todo dia 5: cada fonte entra assim que publica; só grava se algo mudou
  push:
    branches: [main]
    paths: ['scripts/ranking_aeroportos.py', 'scripts/regioes.py', 'scripts/museus.py', 'scripts/cidades.py', 'scripts/bases_fixas.py', '.github/workflows/ranking-aeroportos.yml']
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4 openpyxl
      - run: python scripts/ranking_aeroportos.py > scripts/ranking-log.txt 2>&1 || (cat scripts/ranking-log.txt; echo FALHOU >> scripts/ranking-log.txt)
      - run: python scripts/museus.py >> scripts/ranking-log.txt 2>&1 || (cat scripts/ranking-log.txt; echo FALHOU MUSEUS >> scripts/ranking-log.txt)
      - run: python scripts/cidades.py >> scripts/ranking-log.txt 2>&1 || (cat scripts/ranking-log.txt; echo FALHOU CIDADES >> scripts/ranking-log.txt)
      - run: python scripts/bases_fixas.py >> scripts/ranking-log.txt 2>&1 || (cat scripts/ranking-log.txt; echo FALHOU BASES >> scripts/ranking-log.txt)
      - name: Salva se mudou
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add ranking-aeroportos.json museus.json cidades-pop.json aeroportos.json municipios-br.json scripts/ranking-log.txt
          git diff --cached --quiet || (git commit -m "Atualiza bases (rankings, museus, cidades, aeroportos e municípios)" && git push)
